l_english:
 REBEL_YELL: "Rebel Yell"
 REBEL_YELL_DESC: "Zapadoslavia sits at the precipice of peace for the first time in three centuries, with Simeon I Vlastimirovic seeking to expel the influence of the Polish Radogostids, who currently support the claim of Duke Jadransko to the throne in Severnija. \nHistorically, 1446 would mark the final year of the Severnovic Rebellion, but could you make things play out differently?"