l_english:
 unite_hokun_title: "Unite Hokun!"
 unite_hokun_desc: "The time has come to unite Hokun by force! The time for diplomacy is over and all these warring daimyo lords must be conquered."
 united_hokun_title: "Hokun is United!"
 united_hokun_desc: "The warring factions of Hokun have finally been united under a strong emperor."
 united_hokun_daimyo_title: "Hokun is united!"
 united_hokun_daimyo_desc: "The warring factions of Hokun have finally been united under a strong emperor."
 english_nation_title: "Unite the Anglo-Saxons"
 english_nation_desc: "Through conquest and diplomacy Englonde has managed to transform from a mere settlement into a dominant principality. After several eastern expeditions the Mongol hordes have finally been subdued and a centralized English state, ruled under the suzerainty of the Kaysere, is emerging. Influences from Western Europe are helping us modernize and reform our nation and Western style of education is being adopted."
 kartveli_nation_title: "Reunite Sakartvelo"
 kartveli_nation_desc: "A unified Kartvelebi state has not existed since being invaded by the Nuumunuu Confederation, but with the confederation's collapse, we may yet rise to dominance one more!"
 hungarian_nation_title: "Unite Magaria"
 hungarian_nation_desc: "The Magarian state, which had for centuries ruled as a hegemon of Italia, has fallen victim to its enemies. As its true successors, and with all Magyar and Romanian lands under our control, it is time we restore the Lands of the Crown of Saint Péter."