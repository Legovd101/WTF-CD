 alexandrian_rebels_desc: "Religious fanatics tend to rise up in provinces controlled by nations of a different faith. They seek to spread their faith and smite all unbelievers."
 alexandrian_rebels_name: "$RELIGION$ Zealots"
 alexandrian_rebels_title: "Religious"
 alexandrian_religion_desc: "Born from the blending of eastern and western traditions with Vandalic Arianism, the Ecumenical Church of Alexandria serves as the third major axis of Christianity and spreads from Mauritania to Marathus."
