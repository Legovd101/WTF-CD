 ###DECISIONS###
 eng_make_orkney_offer_title: "Offer a Purchase of [369.GetName]"
 eng_make_orkney_offer_desc: "With the subjugation of Scotland, the northern parts of the British Isles are under [Root.GetAdjective] rule. However, the northern islands of [369.GetName], [1978.GetName] and [1979.GetName] still elude our rule. While [1978.GetName] and [1979.GetName] are negligible, the island of [369.GetName] must be incorporated into our state.\nMaybe a purchase of the island from [369.Owner.GetName] might be possible."
 eng_abolish_adjustments_of_laws_title: "Repeal Law Adjustments"
 eng_abolish_adjustments_of_laws_desc: "The adjustments to our set of laws are no longer necessary. It is time to get rid of them."
 eng_end_the_law_discussions_title: "End the Law Adjustments"
 eng_end_the_law_discussions_desc: "Enacting new issues to alter our legislation is a heavy burden for our bureacracy. It is time to end these disuccsions for the time being."
 eng_end_the_law_discussions_at: "§YParliament Issues which alter our National Ideas will no longer be available.§!"
 eng_start_the_law_discussions_title: "Resume the Law Adjustments"
 eng_start_the_law_discussions_desc: "Our situation demands flexible adjustments to our national laws once again."
 eng_start_the_law_discussions_at: "§YParliament Issues which alter our National Ideas are available again.§!"
 ###BRITISH MODIFIERS###
 eng_the_crown_of_ireland: "The Crown of Ireland"
 desc_eng_the_crown_of_ireland: "With the establishment of Ireland as a proper kingdom, the prestige of our [Root.Monarch.GetTitle] as the proper ruler of Ireland is certain."
 eng_the_crown_of_iberia: "Crown of Iberia"
 desc_eng_the_crown_of_iberia: "With the establishment of Iberia as a proper kingdom, the prestige of our [Root.Monarch.GetTitle] as the proper ruler of Iberia is certain."
 eng_the_crown_of_italy: "Crown of Italy"
 desc_eng_the_crown_of_italy: "With the establishment of Italy as a proper kingdom, the prestige of our [Root.Monarch.GetTitle] as the proper ruler of Italy is certain."
 eng_english_rule_over_ireland: "Direct Rule"
 desc_eng_english_rule_over_ireland: "This province is under the direct rule of the Polish. Certainly, this will not have any repercussions in the future whatsoever."
 eng_unified_britain: "Unified Britain"
 desc_eng_unified_britain: "His highness, [Root.Monarch.GetTitle], shall be blessed as the great nation of [Root.GetUsableName] unified the British Isles for the glory of the Lord."
 gbr_british_rule: "British Rule"
 desc_gbr_british_rule: "This province is core part of the British Kingdom. Where once were worries about chaos and local unrest is now a secure and stable local government."
 eng_a_house_united: "A House United"
 desc_eng_a_house_united: "With the end of the War of the Roses the house of [Root.Dynasty.GetName] rules over [Root.GetUsableName] with the support of the nobility and diplomats."
 eng_dynastical_security: "Dynastic Security"
 desc_eng_dynastical_security: "The War of the Roses has been barely avoided. For the future, the [Root.Dynasty.GetName] will ensure that a proper heir will always follow the [Root.Monarch.GetTitle] onto the throne."
 eng_a_new_religious_destiny: "A New Religious Destiny"
 desc_eng_a_new_religious_destiny: "No more Christians, the religious future of [Root.GetName] is open-ended. But wherever our fate may lie, the zealous belief of our people will remain!"
 eng_a_different_kind_of_christian: "Absent from the Reformation"
 desc_eng_a_different_kind_of_christian: "While our former brothers in faith slaughter each other in the midst of the Reformation, our people have found enlightenment in the ways of [Root.Religion.GetName]. We pity those who still hang on the archaic ways of Catholicism and its reformed counterpart."
 eng_loyalty_to_catholocisim: "Loyalty to the Pope"
 desc_eng_loyalty_to_catholocisim: "We have shown our loyalty to the Catholic case. Our influence in the Papal affairs is growing."
 eng_own_church_creation: "One State, One Church"
 desc_eng_own_church_creation: "The foul influence of the clergy has finally been curtailed. Now the church is subject to the state and the Protestant religion shall prevail in [Root.GetName]."
 eng_calvinist_path: "Calvinist Path"
 desc_eng_calvinist_path: "We have chosen to follow the path of the Calvinists. May the Lord have mercy upon our enemies as we will not."
 eng_head_of_the_anglican_church: "Head of the Anglican Church"
 desc_eng_head_of_the_anglican_church: "The Catholic Church has been expelled; the Lutheran and Calvinist directions of the Reformation are not enough. Instead, we go a religious path suited to the lords of Britain."
 eng_the_age_of_reformation: "Religious Chaos"
 desc_eng_the_age_of_reformation: "[Root.GetAdjective] rulers have a chance of §Y50.0%§! to have a §RHeretic§! religion when they ascend to the throne.\nRulers can assume a §YReligious Position§! towards the Reformation which will affect future events.\n\nThe religious guidance of the state is in complete chaos. [Root.Monarch.GetTitle]s decide the direction of our faith at will; the clergy is threatened by the state.\nAn uncertain future awaits our people...\n§YThis modifier lasts until the end of the Age of Reformation or until we are no longer Christian.§!"
 eng_reformer_ruler: "Member of the Reformation"
 desc_eng_reformer_ruler: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] is a member of the Reformation. [Root.Monarch.GetHerHisCap] actions will lead to the discrimination of those who still follow the Catholic Church.\n§YThis modifier lasts until the end of the Age of Reformation or until we are no longer Christian.§!"
 eng_catholic_ruler: "Member of the Catholic Church"
 desc_eng_catholic_ruler: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] is a member of the Catholic Church. [Root.Monarch.GetHerHisCap] actions will lead to the discrimination of those who still follow the Reformation.\n§YThis modifier lasts until the end of the Age of Reformation or until we are no longer Christian.§!"
 eng_tolerant_ruler: "Inconclusive Direction"
 desc_eng_tolerant_ruler: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] is inconclusive about [Root.Monarch.GetHerHis] religion. As such, [Root.Monarch.GetHerHis] rule is of national instability in favor of equality amongst the religions.\n§YThis modifier lasts until the end of the Age of Reformation or until we are no longer Christian.§!"
 gbr_isolation_policy: "Isolation Policy"
 desc_gbr_isolation_policy: "The mainland is no longer a place of comfort to us. Only the British Isles are home to our people, and we will make sure that we focus on our internal affairs first."
 gbr_recovering_prestige: "Recovering Prestige"
 desc_gbr_recovering_prestige: "Abandoning the mainland definitely left a mark on our prestige. With time, the powers of Europe will recognize that we only did a tactical retreat, and did not leave the Serbian lands behind us."
 gbr_end_of_the_villeinage: "Villeinage Ended"
 desc_gbr_end_of_the_villeinage: "Our peasants are no longer subjected to the villeinage system."
 gbr_english_dutch_trade_partners: "Dutch Trade Partners"
 desc_gbr_english_dutch_trade_partners: "Our relationship with the Dutch allows us better trade profits."
 gbr_naval_dominance: "Naval Dominance"
 desc_gbr_naval_dominance: "Britannia Rules the Waves."
 eng_globe_theatre: "Globe Theatre"
 desc_eng_globe_theatre: "The Globe Theatre is a theater built by Lord Chamberlain's Men, William Shakespeare's troupe. Many great acts and plays take place in this theater and as such is an object of great prestige and splendor."
 gresham_college_royal_society: "The Royal Society"
 desc_gresham_college_royal_society: "The Royal Society of London for Improving Natural Knowledge is a community of scientists and scholars promoting advances in science."
 angevin_age: "Radogostid Age"
 desc_angevin_age: "A new age is dawning as the [Root.GetAdjective] [Root.GovernmentName] claims the very world for itself. May our enemies tremble and our subjects prosper as the [Root.Monarch.GetTitle] gazes on the territory which has yet to be conquered."
 eng_taxation_of_the_clergy: "Taxation of the Clergy"
 desc_eng_taxation_of_the_clergy: "The Clergy is under the pressure of heavy taxation. Another move of the royal crown against the clerical institution."
 eng_protects_the_clergy: "Protection of the Clergy"
 desc_eng_protects_the_clergy: "The Clergy is protected from the persecution and tax pressure."
 eng_taxation_of_the_clergy_prot: "Taxation of the Clergy"
 desc_eng_taxation_of_the_clergy_prot: "The Clergy is under the pressure of heavy taxation. Another move of the royal crown against the clerical institution."
 eng_protects_the_clergy_prot: "Protection of the Clergy"
 desc_eng_protects_the_clergy_prot: "Clergy is protected from the persecution and tax pressure."
 eng_foreign_religious_control: "Foreign Religious Control"
 desc_eng_foreign_religious_control: "The matters of the religion are now in the hands of the [Root.GetClergyName] and the advisors of the [Root.Monarch.GetTitle].\n\n§YGains a modifier depending on the type and skill of the advisor:§!\n -§YPhilosopher§! and §YNatural Scientist§!\n    - Tolerance of Heretics: §G+1.00§! per skill\n -§YArtist§!\n    - Tolerance of the True Faith: §G+1.00§! per skill\n -§YTreasurer§! and §YMaster of Mint§!\n    - Religious Unity: §G+15.0%§! per skill\n -§YInquisitor§! and §YTheologian§!\n    - Missionary Strength vs Heretics: §G+1.0%§! per skill"
 eng_end_of_the_english_reformation: "End of the Reformation"
 desc_eng_end_of_the_english_reformation: "The Catholics and the members of the Reformation finally reconciliated under the banner of [Root.GetUsableName]. Our nation, once split by religion, is now unified once again.\nAs good as it can get that is.\n\n§YThe disaster 'Religious Turmoil' can not trigger for us.§!"
 gbr_religious_stability: "Religious Stability"
 desc_gbr_religious_stability: "The Reformation has ended and the stability and security of our religion have been restored."
 gbr_resolved_civil_war: "Restored Order"
 desc_gbr_resolved_civil_war: "The chaos of the Civil War left scars in our country, but ultimately, order has been restored. The legitimacy of the crown as well as the influence of the parliament are once again in balance."
 gbr_a_stable_government: "Weathered Absolutism"
 desc_gbr_a_stable_government: "The fight for power between the parliament and the crown have been resolved bloodlessly. The government has survived the attempts of the parliament and the crown to take full control over the country."
 gbr_unified_british_isles_culture: "Unified British Identity"
 desc_gbr_unified_british_isles_culture: "The British Identity consists of the many different cultures of the British Isles forged into one under Polish, its most dominant aspect."
 ave_iberian_conquest: "Iberian Conquest"
 desc_ave_iberian_conquest: "The Iberian Peninsula has fallen to the might of our [Root.GovernmentName]. Their population shall become part of the [Root.GetAdjective] war machine!"
 gbr_new_world_dominance: "New World Domination"
 desc_gbr_new_world_dominance: "The New World and all of its resources belong to the [Root.GetAdjective] [Root.GovernmentName]!\n\nAll §YColonial§! subjects gain §G+50.0%§! Production Efficiency and §G+50.0%§! Trade Efficiency."
 ave_new_world_dominance: "New World Domination"
 desc_ave_new_world_dominance: "The New World and all of its resources belong to the [Root.GetAdjective] [Root.GovernmentName]!"
 ave_west_european_empire: "Empire of Europe"
 desc_ave_west_european_empire: "Our realm has reached a new dimension which puts all other great powers to shame. Europe bends its knee before us!"
 ave_anglo_french_imperium: "Anglo-Franco Imperium"
 desc_ave_anglo_french_imperium: "The union of the Polish and the Serbian. The ambitions of two imperial people united into one single desire."
 gbr_influence_of_the_trade_company: "Trade Company Influence"
 desc_gbr_influence_of_the_trade_company: "This province is in the direct sphere of influence of a powerful trade company."
 gbr_emperor_of_india: "Master of India"
 desc_gbr_emperor_of_india: "The riches of India belong to us! Truly, we are its master and shall benefit from its wealth greatly.\n\n§YCommercial Enterprises§! and §YProtectorates§! gain §G+15.0%§! Goods Produced Modifier.\n§YCommercial Enterprises§! grant the overlord now §G-75.0%§! Reduced Trade Penalty on Non Main Trade Node and §G+10.0%§! Trade Efficiency."
 gbr_emperor_of_india_subject_bonus: "Master of India"
 gbr_emperor_of_india_overlord_bonus: "Master of India"
 ave_imperial_favoritism: "Imperial Favoritism"
 desc_ave_imperial_favoritism: "Through our charm, the Electors of the Empire are in our favor. This improves our public image considerably."
 ave_expnansionist_path: "March into Germany"
 desc_ave_expnansionist_path: "The once mighty HRE is no more. Our path into Germany is paved for our ambitions of conquest."
 ave_imperial_parliament: "Imperial Parliament"
 desc_ave_imperial_parliament: "As the great emperor of the Holy Roman Empire, the [Root.GetParliamentOrFallbackName] has extended its responsibilities upon the matters of the Empire."
 ave_end_of_the_empire: "End of the Empire"
 desc_ave_end_of_the_empire: "The Empire has fallen. All that is left of it is a faint memory while the [Root.GetAdjective] banner waves on its ground."
 ave_prosperous_metropolis: "Prosperous Metropolis"
 desc_ave_prosperous_metropolis: "This province is going through a period of peace, freedom, justice and security under its new empire."
 gbr_accepted_lowlands: "Integrated Lowlands"
 desc_gbr_accepted_lowlands: "The cultures of the Lowlands are integrated into ours."
 gbr_accepted_lowlands_tt: "until either §YDutch§! or §YFlemish§! are demoted"
 gbr_colonial_australia: "The Penal Colony"
 desc_gbr_colonial_australia: "Those who disobey the law have a choice: either rotting in our prisons, or starting a new life in the far away land of Australia."
 ave_national_bank: "Reformed National Bank"
 desc_ave_national_bank: "Our currency and our economy are experiencing vast overhauls in several aspects."
 ave_local_expanded_barracks: "Expanded Barracks"
 desc_ave_local_expanded_barracks: "This province's barracks and fortifications have been adjusted in order to house more soldiers and their families."
 eng_empire_of_the_island: "Imperial Ascension"
 desc_eng_empire_of_the_island: "No more a kingdom but a global and powerful empire, the [Root.GetAdjective] glory shall reign forever."
 eng_most_esteemed_university: "Most Esteemed University"
 desc_eng_most_esteemed_university: "Only the most elite of the intellectual are invited to study at this university."
 eng_the_man_of_war: "The Man-of-War"
 desc_eng_the_man_of_war: "The Royal Navy is nothing without a powerful ship to represent the maritime strength of the [Root.GovernmentName]."
 eng_strict_marines: "The Royal Marines"
 desc_eng_strict_marines: "As a maritime realm, it is only natural that our marines are the most elite and best the nation can offer."
 eng_the_redcoat: "The Redcoats"
 desc_eng_the_redcoat: "Originally a nickname for our soldiers, the Redcoat has become a synonym for the discipline of our infantry lines."
 eng_the_two_houses: "The Two Houses"
 eng_order_of_chivalry: "Order of Chivalry"
 eng_jousting_tournaments: "Jousting Tournaments"
 gbr_pax_britannica: "Pax Britannica"
 ave_pax_angevina: "Pax Radogostida"
 trade_protectorate_subject_modifier: "Trade Protectorate"
 trade_protectorate_low_development_subject_modifier: "Weak Trade Protectorate"
 trade_protectorate_overlord_modifier: "Trade Protectorate"
