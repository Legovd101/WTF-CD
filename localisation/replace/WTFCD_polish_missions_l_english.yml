 force_french_union_debate_title: "[Root.GetActsOfUnionDecisionTitle]"
 force_french_union_debate_desc: "[Root.GetActsOfUnionDecisionDesc]"
 acts_of_union_debate_title: "Force Acts of Union Debate"
 acts_of_union_debate_desc: "Our country is split into two crowns, both of equal importance to our authority. The [Root.GetParliamentOrFallbackName] must discuss now the future of our two thrones."
 eng_disable_colonial_ventures_title: "Grant Autonomy to Colonial Enterprises"
 eng_disable_colonial_ventures_desc: "Managing the affairs over the sea is an exhausting endeavour. It might be wise to let the colonists decide on their own what is best for their ventures."
 eng_disable_colonial_ventures_tt: "The event '§YColonial Venture§!' will no longer fire whenever a colony is finished."
 eng_enable_colonial_ventures_title: "Revoke Autonomy from Colonial Enterprises"
 eng_enable_colonial_ventures_desc: "The colonists enjoyed autonomy for long enough. It is time to take a more active role in the affairs of the new world."
 eng_enable_colonial_ventures_tt: "The event '§YColonial Venture§!' fires again whenever a colony is finished."
