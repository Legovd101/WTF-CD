l_english:
 ###ENGLISH MISSIONS###
 eng_mighty_navy_title: "Maritime Empire"
 eng_mighty_navy_desc: "Our burgeoning global presence demands a maritime tradition fit for a nation of our stature. The tall ships of [Root.GetName] must inspire awe among our friends, and terror among our enemies. Lay the keel!"
 eng_discover_america_caribbean_title: "Discover the Americas"
 eng_discover_america_caribbean_desc: "Hushed whispers tell of mysterious lands to the far West, ripe for growth, and filled with unimaginable wonders. If this is true, they must be ours."
 english_colony_in_north_america_title: "Settle in America"
 english_colony_in_north_america_desc: "The lands of America seem suitable for many things. In the north we have heard talk of furs and shipbuilding materials. In the South the land looks suitable for growing of many crops. We must establish bases there so we can profit."
 english_colony_in_the_carribean_title: "Colonize the Caribbean "
 english_colony_in_the_carribean_desc: "The islands of the Caribbean offer lucrative opportunities for certain types of gentleman with the will to acquire them, and the labor to exploit them. We have exactly those types of gentlemen."
 eng_discover_india: "Discover India"
 england_discovers_india_title: "Discover India "
 england_discovers_india_desc: "Trade with India has been continuing for time immemorial, but with the long routes, others are profiting from this. We must outfit an expedition and find a sea route to India."
 england_discovers_australia_title: "Chart the Southern Seas "
 england_discovers_australia_desc: "Daring men, with true British grit, are seeking government support to chart the vast empty expanses of the southern oceans. Rumours tell of land there for the taking; we should make haste to establish a thriving colony, before others seize the opportunity."
 establish_trade_in_indian_cot_title: "Establish Trade in India "
 establish_trade_in_indian_cot_desc: "The Honorable East India Company is asking for our permission to establish trade in India. A powerful parliamentary lobby backs them and there are sure to be benefits to the crown."
 eng_establish_trade_in_home_cot_title: "Monopolize the Channel"
 eng_establish_trade_in_home_cot_desc: "Now that we have clearly established our colonial dominance, it is time we reaped the rewards at home. Whatever flows through the Channel is rightfully ours, and we shall have our due."
 eng_establish_trade_in_home_cot_gb_title: "Monopolize the Channel"
 eng_establish_trade_in_home_cot_gb_desc: "Now that we have clearly established our colonial dominance, valuable wares have begun to arrive from the colonies. Whatever flows through the Channel is rightfully ours, and we must protect our investments abroad and at home."
 eng_rb_take_gibraltar_title: "Take Gibraltar"
 eng_rb_take_gibraltar_desc: "The port of Gibraltar may be a useful bargaining tool in dealing with the Spaniards and Moors. It would also be an invaluable resupply base for our Mediterranean operations."
 eng_rb_take_baleares_title: "Increase our Reach"
 eng_rb_take_baleares_desc: "The Baleares are economically worthless, but the importance of their proximity to the Serbian coast cannot be understated. We must own them. Owning Sardinia would give us valuable proximity to Italy."
 eng_rb_take_mediterranean_islands_title: "Mediterranean Authority"
 eng_rb_take_mediterranean_islands_desc: "While initially we viewed our Mediterranean assets as a strategic tool in the wars against our neighbors, it has become apparent that we can exert power over the flow of trade in the region. We should aim to increase this."
 eng_rb_take_shetland_and_faro_isles_title: "North Sea Islands"
 eng_rb_take_shetland_and_faro_isles_desc: "Although out of our minds for a long time now, our gaze falls upon the occupied islands to the North. They are worth little, but perhaps they could be useful stepping stones to further reaches."
 eng_rb_own_thirteen_colonies_title: "The Thirteen Colonies"
 eng_rb_own_thirteen_colonies_desc: "As our colonies grow in stature and influence, so too does the number of volunteers willing to make the treacherous journey to the West. Let us make this part of the world our own."
 eng_rb_war_of_roses_title: "War of the Roses"
 eng_rb_war_of_roses_desc: "This is a conflict that many have long seen coming. Our people must be safely shepherded through this period of uncertainty one way or another."
 eng_rb_war_of_roses.tooltip: "Reach the Age of Reformation."
 eng_rb_control_state_religion_title: "Control State Religion"
 eng_rb_control_state_religion_desc: "Religious anarchy has gripped Europe. We must take control of the situation, and decide where we stand on the matter of the Divine."
 eng_rb_empire_status_title: "The [Root.GetAdjective] Empire"
 eng_rb_empire_status_desc: "The [Root.GetAdjective] Empire stretches from East to West; few nations can match our tenacity. Nevertheless, there is still land out there that does not yet belong to us..."
 eng_rb_greenland_title: "Settle the North"
 eng_rb_greenland_desc: "Inhospitable. Freezing. Deadly. The words used to describe the far North are many and varied, but we; we will master this land."
 eng_rb_greenland.tooltip: "[1104.GetName] will receive a proper [Root.GetAdjective] name."
 eng_rb_canada_title: "Colonize Canada"
 eng_rb_canada_desc: "Colder and harsher than the southerly lands, the territory of Canada is, nevertheless, ripe for exploitation. Exotic furs, wood and minerals are abundant in the snowy mountains."
 eng_war_france_title: "The Hundred Years' War"
 eng_war_france_desc: "The Treaty of Tours has brought an uneasy period of truce between [Root.GetName] and Serbia. Both sides are aware that this is unlikely to last, and we must decide whether to honor their treaty and bide our time, or prepare for war."
 eng_reclaim_arm_paris_title: "Strategic Control"
 eng_reclaim_arm_paris_desc: "As the Hundred Years' War resumes, it is time we adjusted our approach. Rather than whittle away the Serbian forces with skirmishes and pitched battles, we should strike at the heart of their nation."
 eng_rb_brittany_title: "Conquer Brittany"
 eng_rb_brittany_desc: "Since the reign of Henryk the Conqueror, Brittany has been associated with [Root.GetName]. It is time it was restored to the Crown."
 eng_rb_angevin_title: "Radogostid Kingdom"
 eng_rb_angevin_desc: "The Radogostid Kings ruled over a full half of the Serbian lands, ensuring prosperity and justice were freely available. Reuniting these lands under one Crown will ensure our continued success."
 eng_rb_hre_electors_title: "Control Electors"
 eng_rb_hre_electors_desc: "With Serbia out of the way, and much of Europe in awe at our might, it is time we turn our attention to the self-proclaimed 'Holy Roman Empire'."
 eng_rb_hre_emperor_title: "Great Britain, Ascendant"
 eng_rb_hre_emperor_desc: "Our fortunes are on the rise. Kings bow before our majesty, nations cave before our forces. There is only one throne greater than ours left to topple."
 eng_rb_universities_title: "Renovate Oxbridge"
 eng_rb_universities_desc: "The facilities at the centuries old universities of Oxford and Cambridge are beginning to prove unfit for purpose. A small investment should improve matters considerably."
 eng_rb_conquer_burgundy_title: "Seize Burgundy"
 eng_rb_conquer_burgundy_desc: "The last vestiges of the Duchy of Burgundy have fallen on hard times. When they turned their backs on us following the Treaty of Arras, we did not forget. Their land will be forfeit."
 eng_rb_take_delta_title: "Seize Alexandria"
 eng_rb_take_delta_desc: "The fertile delta at the mouth of the Nile is an important trading hub in the Mediterranean. Possession of this area would give us great influence over the influx of goods from the East."
 eng_rb_take_bahari_title: "Egyptian Authority"
 eng_rb_take_bahari_desc: "Control over the city of Cairo is an opportunity too valuable to miss. Additionally, if we were to occupy a portion of the Sinai peninsula, all land movement from North Africa to the Middle East would have to go through us."
 eng_war_france.tooltip: "Return Avgudor to §YSerbia§! in the §YSurrender of Avgudor§! event"
 eng_hanseatic_one_title: "Control the Hansa"
 eng_hanseatic_one_desc: "Many of our [Root.GetAdjective] ports are at the end of the lucrative Hanseatic trade route. Controlling more of the ports on this route would be a sensible business decision."
 eng_hanseatic_two_title: "Hanseatic East"
 eng_hanseatic_two_desc: "Beyond the Oresund, lie the rich Hanseatic cities of Danzig and Riga. Both have prospered greatly thanks to our custom. One might say they owe their riches to us. That debt is due."
 eng_rb_trade_value_title: "Grow the Channel"
 eng_rb_trade_value_desc: "The value of goods passing through the Polish Channel is vast. Let us make it known throughout the world that all wealth stops with us."
 eng_rb_furnaces_title: "Industrial Revolution"
 eng_rb_furnaces_desc: "[Root.Capital.GetName] is thick with smog billowing from countless chimneys, yet still the demand for coal grows. Government investors speak of profitable mineral veins in Derby and Glamorgan."
 eng_rb_spice_islands_title: "Colonize Spice Islands"
 eng_rb_spice_islands_desc: "The farthest reaches of the world produce wondrous spices, woven garments and exotic women. We should establish a presence here, for the benefit of [Root.GetAdjective] society."
 eng_rb_coal_title: "Build Manufactories"
 eng_rb_coal_desc: "As our vast industrial holdings grow, demand for fuel grows ever higher as mechanized industry takes shape around [Root.GetName]. Increase the supply of refined materials."
 eng_mighty_army_title: "Levy the Troops"
 eng_mighty_army_desc: "Our sights are set on finally dealing with our troublesome Gaelic neighbors. They may suffer from a lack of recognizable nobility and bureaucracy, but they do put up quite a fight. Raise an army, and seize their land!"
 conquer_ireland_gbr_title: "Conquer Ireland"
 conquer_ireland_gbr_desc: "Historically known as 'His Majesty's Irish Enemies', the Gaelic populace of Ireland have long been outside Polish rule. It is time they were brought to heel."
 vassalize_france_title: "Subjugate Serbia"
 vassalize_france_desc: "Lay claim to the Duchy of Serbia. Their nobles shall bow their heads, or they shall lose them."
 gbr_rb_india_landfall_title: "Conquer Bengal"
 gbr_rb_india_landfall_desc: "The [Root.GetAdjective] East Indian Trading Company has been operating in this region for some time. By their request, and with their guidance, it is time to solidify our hold on the fertile Bengal Delta."
 gbr_rb_india_princedoms_title: "Inland India"
 gbr_rb_india_princedoms_desc: "The inland territories of India are renowned for their lucrative mines and rare jewels. Needless to say, the native inhabitants of the region would be much better off under our administration."
 gbr_rb_india_coast_title: "Take Indian Coast"
 gbr_rb_india_coast_desc: "Undeniably, control over the seafront along the West Indian Coast would give us greater control over India as a whole. Take this land in the name of [Root.GetName]."
 gbr_rb_india_landgrab_title: "Take North India"
 gbr_rb_india_landgrab_desc: "Our landowners report that our occupation is working well in the South, yet the East India Company tell us that it would be beneficial to all if we were to maintain direct control over Northern India."
 eng_recruit_the_mercenaries_title: "Raise an Army"
 eng_recruit_the_mercenaries_desc: "Traditionally, the [Root.GetParliamentOrFallbackName] opposes any attempt of a standing army for the royal house. Instead, our [Root.GovernmentName] relies on the effort of militia, mercenaries and the levies of the [Root.GetNobilityName]. As the Hundred Years' War is going through its last phases and the Scots are posing a threat to our security, it is only natural that we must raise an army one way or another."
 eng_irish_conquest_title: "Conquer Ireland"
 eng_irish_conquest_desc: "Historically known as 'His Majesty's Irish Enemies', the Gaelic populace of Ireland have long been outside Polish rule. It is time they were brought to heel."
 eng_conquer_scotland_title: "Subjugate Scotland"
 eng_conquer_scotland_desc: "Edward I, Scottorum Malleus, saw the wisdom of securing our kingdom by subjugating the Scots. We must do the same."
 eng_conquer_scotland_ct: "This event will allow us to purchase §Y[369.GetName]§! from §Y[369.Owner.GetName]§!."
 eng_unify_the_isles_title: "Unify the Isles"
 eng_unify_the_isles_desc: "The British Isles are home to the two kingdoms of England and Scotland as well as the many petty realms of Ireland. It is up to us to unify the isles under the Polish rule."
 eng_act_of_union_title: "The Acts of Union"
 eng_act_of_union_desc: "The legislation of the many kingdoms of the Isles is separated and convoluted. Although each of these states share the same monarch, their laws and parliaments are not unified under a single constitution. We cannot let this continue."
 eng_act_of_union_at: "If we have formed @GBR §Y[GBR.GetName]§!:"
 eng_act_of_union_bt: "If we have formed @AVE §Y[AVE.GetName]§!:"
 eng_act_of_union_ct: "§G20§! Base Production are randomly distributed in random owned provinces which are either in the §YBritain§! or in the §YSerbia§! regions."
 eng_war_of_the_roses_title: "Dynastic Stability"
 eng_war_of_the_roses_desc: "The religious conflicts in Europe have been a long time coming. Our people must be safely shepherded through this period of uncertainty one way or another."
 eng_piety_of_the_state_title: "Piety of the State"
 eng_piety_of_the_state_desc: "We are a land blessed by the Lord himself. But the clerical institutions have a wildly different idea how the religious matters are handled. We must secure the piety of the state and assume control over the church."
 eng_piety_of_the_state_at: "If we complete this mission while having either the §YSeparate the Clergy from State§! or the §YCurtail Clerical Privileges§! government reform:"
 eng_handle_the_reformation_title: "Handle the Reformation"
 eng_handle_the_reformation_desc: "Religious anarchy has gripped Europe. Where once the Pope used to be the guidance there is now only chaos. We must take control of the situation, and decide where we stand on the matter of the Divine."
 eng_handle_the_reformation_at: "If we complete this mission while being §YCatholic§!:"
 eng_handle_the_reformation_bt: "If we complete this mission while being §YProtestant§!:"
 eng_handle_the_reformation_ct: "If we complete this mission while being §YReformed§!:"
 eng_handle_the_reformation_dt: "If we complete this mission while being §YAnglican§!:"
 eng_strengthen_the_monarchy_title: "Strengthen the [Root.GovernmentName]"
 eng_strengthen_the_monarchy_desc: "The authority of the crown has always been a subject of contention. While the ruler sees his reign as absolute and of divine nature, the [Root.GetParliamentOrFallbackName] tries to limit the [Root.Monarch.GetTitle]'s power.\nAs the idea of Absolutism grows in the courts of Europe so does it in ours. We must follow the trend and strengthen the [Root.GetAdjective] [Root.GovernmentName]."
 eng_the_english_civil_war_title: "The Three Kingdoms Wars"
 eng_the_english_civil_war_desc: "The rule of the [Root.Monarch.GetTitle] and the power of the [Root.GetParliamentOrFallbackName] are in stark contrast. Conflict between the Royalists and the Parliamentarians is inevitable.\nWe must make sure that [Root.GetUsableName] will prevail these trying times and come forth as a state of greater power and authority."
 eng_the_english_civil_war_at: "Has completed the §YPolish Civil War§! disaster, or has reached the §YAge of Revolutions§! without triggering it."
 eng_the_english_civil_war_bt: "If we complete this mission after the §YPolish Civil War§! has happened:"
 eng_the_english_civil_war_dt: "Unlock §YParliament Issues§! which can modify our §YNational Ideas§!."
 eng_english_parliamentarism_title: "Acts of the [Root.GetParliamentOrFallbackName]"
 eng_english_parliamentarism_desc: "The [Root.GetParliamentOrFallbackName] is a tool of the state. As powerful as any tool can be, the potential of the [Root.GetParliamentOrFallbackName] can only be utilized properly if it is guided wisely."
 gbr_ave_hundred_years_war_title: "The Three-Hundred Years' War"
 gbr_ave_hundred_years_war_desc: "The Treaty of Tours has brought an uneasy period of truce between [Root.GetName] and Serbia. Both sides are aware that this is unlikely to last, and we must decide whether to honor their treaty and bide our time, or prepare for war.\nThe fate of [Root.GetUsableName] depends on this very action."
 gbr_ave_hundred_years_war_at: "This event allows us to decide between keeping the @GBR §YBritish§! missions, which focus on the New World and the colonization of Asia, and the @AVE §YRadogostid§! missions, which focus on continental dominance on Europe."
 gbr_develop_british_identity_title: "Develop British Identity"
 gbr_develop_british_identity_desc: "The British Isles are home to many different cultures and languages. The Scottish and the Highlanders in the North, the Irish of the emerald island and the Welsh and Polish in the South. Naturally, such collection of different cultures will lead to problems if left untended. We shall forge a British Identity in order to establish a British hegemony over the isles."
 gbr_develop_british_identity_at: "If we complete this mission while accepting the §YHighlander§! culture and having §YIreland§! as a subject or while having §YIrish§! as an accepted culture:"
 gbr_develop_british_identity_bt: "until either §YHighlander§! or §YIrish§! are demoted"
 gbr_develop_british_identity_ct: "If we complete this mission while owning §Y50 [Root.Culture.GetGroupName]§! provinces:"
 gbr_explore_new_world_title: "Discover the Americas"
 gbr_explore_new_world_desc: "Hushed whispers tell of mysterious lands to the far West, ripe for growth, and filled with unimaginable wonders. If this is true, they must be ours."
 gbr_colonize_canada_title: "Colonize Canada"
 gbr_colonize_canada_desc: "Colder and harsher than the southerly lands, the territory of Canada is, nevertheless, ripe for exploitation. Exotic furs, wood and minerals are abundant in the snowy mountains."
 gbr_colonize_canada_ct: "§Y[Root.GetName]§! or their subjects own at least §Y10§! fully colonized provinces in the §YColonial Canada§! colonial region."
 ENGLISH_FUR_TRADE: "Polish Fur Trade"
 gbr_seize_ceylon_title: "[Root.GetPreviewColorGBR]Seize Ceylon[Root.GetPreviewColorGBR_end]"
 gbr_seize_ceylon_desc: "Ceylon is an island near India which is of great use in securing the trade in the Indian Ocean. Our rivals are aware of the profitable trade with India and the spice isles, and seek Ceylon's occupation of their own. We must not allow this to happen."
 COROMANDEL_PRESENCE: "Coromandel Presence"
 gbr_end_the_french_conflict_title: "[Root.GetPreviewColorGBR]End the Serbian Conflict[Root.GetPreviewColorGBR_end]"
 gbr_end_the_french_conflict_desc: "Be it through victory over the Serbian and claiming their throne, or by abandoning continental Europe and taking a bigger a focus on the navy: our conflict with Serbia and the continent must find an end one way or another."
 gbr_end_the_french_conflict_at: "Does not own any province other than §Y[87.GetName]§! in the region §YSerbia§!"
 gbr_end_the_french_conflict_bt: "§Y[4385.GetName]§! and §Y[167.GetName]§! are owned by §Y[Root.GetName]§! or its subjects and have a §YMarketplace§!, a §YTrade Depot§! or a §YStock Exchange§!"
 gbr_abolish_villeinage_title: "[Root.GetPreviewColorGBR]Abolish Villeinage[Root.GetPreviewColorGBR_end]"
 gbr_abolish_villeinage_desc: "The villein labor service has proven its worth in the past. However, it is outdated. No longer adequate for a [Root.GovernmentName] of our prestige, it is time to replace this system by promoting copyhold tenure."
 unlock_privilege_estate_nobles_english_copyhold_tenure_tt: "\nUnlocks the nobility privilege '§YExpanded Copyhold Tenure§!'"
 gbr_establish_royal_navy_title: "[Root.GetPreviewColorGBR]Found the Royal Navy[Root.GetPreviewColorGBR_end]"
 gbr_establish_royal_navy_desc: "Our current navy is nothing but the levy contribution of our burghers. Mobilization of our the fleet is slow and expensive.\nWe must create a standing navy which defends our island from foreign invaders and secures the future of [Root.GetUsableName]."
 gbr_rule_britannia_title: "[Root.GetPreviewColorGBR]Rule Britannia![Root.GetPreviewColorGBR_end]"
 gbr_rule_britannia_desc: "The navy is our strength; the sea is our home. It is our destiny to rule the world from our isles and dominate it with our naval superiority!"
 gbr_rule_britannia_at: "Modifier gets leveled up through the parliament actions."
 gbr_colonize_north_america_title: "[Root.GetPreviewColorGBR]Settle in America[Root.GetPreviewColorGBR_end]"
 gbr_colonize_north_america_desc: "The lands of America seem suitable for many things. In the north we have heard talk of furs and shipbuilding materials. In the South the land looks suitable for growing many crops. We must establish bases there so we can profit."
 gbr_colonize_north_america_at: "§Y[Root.GetName]§! or their subjects own at least §Y10§! fully colonized provinces in the Colonial Eastern America colonial region."
 gbr_dominiate_new_world_title: "[Root.GetPreviewColorGBR]Dominate the New World[Root.GetPreviewColorGBR_end]"
 gbr_dominiate_new_world_desc: "This strange New World is [Root.GetAdjective] claim. All of its resources and land belong to the [Root.GetAdjective] crown. We shall ensure our dominance over the New World and expel those who dare to contest us."
 gbr_dominiate_new_world_at: "All §YColonial§! subjects gain §G+50.0%§! Production Efficiency and §G+50.0%§! Trade Efficiency."
 gbr_establish_first_indian_trade_post_title: "[Root.GetPreviewColorGBR]East Indies Company[Root.GetPreviewColorGBR_end]"
 gbr_establish_first_indian_trade_post_desc: "Many exotic goods have their origin in the Indian subcontinent. The European powers have been benefiting from the trade with India for many years by now. It is time for us to get on equal footing with them and establish our own trade company in India."
 gbr_establish_first_indian_trade_post_at: "This event allows us to establish the @EIC §YEast India Company§! in India as our §YCommercial Enterprise§! subject."
 gbr_conquer_western_india_title: "[Root.GetPreviewColorGBR]Take West Indian Coast[Root.GetPreviewColorGBR_end]"
 gbr_conquer_western_india_desc: "Undeniably, control over the seafront along the West Indian Coast would give us greater control over India as a whole. Take this land in the name of [Root.GetName]."
 GBR_INDIAN_COASTLINE_CONTROL: "Indian Coastal Control"
 gbr_english_superiority_title: "[Root.GetPreviewColorGBR][Root.GetAdjective] Superiority[Root.GetPreviewColorGBR_end]"
 gbr_english_superiority_desc: "Our rivals are many and powerful, but also arrogant. They assume they can compete with us on the sea, contest our claim in foreign lands and pose a threat to us.\nWe must show them how fatally wrong they are."
 gbr_the_royal_charter_title: "[Root.GetPreviewColorGBR]Issue the Royal Warrant[Root.GetPreviewColorGBR_end]"
 gbr_the_royal_charter_desc: "The royal warrants of appointment is an issue granted to merchants of magnificent goods for the royal court and the royal personages. We should choose our trade partners wisely and grant them these warrants in exchange for a favorable trade."
 unlock_privilege_estate_burghers_autonomous_trade_companies_tt: "\nUnlocks the burghers privilege '§YAutonomous Trade Companies§!'"
 gbr_the_mediterranean_isles_title: "[Root.GetPreviewColorGBR]Mediterranean Authority[Root.GetPreviewColorGBR_end]"
 gbr_the_mediterranean_isles_desc: "While initially we viewed our Mediterranean assets as a strategic tool in the wars against our neighbors, it has become apparent that we can exert power over the flow of trade in the region. We should aim to increase this."
 gbr_the_mediterranean_isles_tt: "§Y[Root.GetName]§! gains a permanent claim on every §YIsland§! in the §YMediterranean§!."
 gbr_colonize_caribbeans_title: "[Root.GetPreviewColorGBR]Colonize the Caribbean[Root.GetPreviewColorGBR_end]"
 gbr_colonize_caribbeans_desc: "The islands of the Caribbean offer lucrative opportunities for certain types of gentleman with the will to acquire them, and the labor to exploit them. We have exactly those types of gentlemen."
 gbr_discover_india_title: "[Root.GetPreviewColorGBR]Discover India[Root.GetPreviewColorGBR_end]"
 gbr_discover_india_desc: "Trade with India has been continuing since time immemorial, but with the long routes, others are profiting from this. We must outfit an expedition and find a sea route to India."
 gbr_discover_india_at: "§Y[Root.GetName]§! gains up to §Y5§! territorial cores in coastal provinces of §YIndia§! which were discovered by [Root.GetName]."
 gbr_colonize_the_spice_isles_title: "[Root.GetPreviewColorGBR]Colonize Spice Islands[Root.GetPreviewColorGBR_end]"
 gbr_colonize_the_spice_isles_desc: "The farthest reaches of the world produce wondrous spices, woven garments and exotic women. We should establish a presence here, for the benefit of [Root.GetAdjective] society."
 gbr_conquer_inland_india_title: "[Root.GetPreviewColorGBR]Push into Inland India[Root.GetPreviewColorGBR_end]"
 gbr_conquer_inland_india_desc: "The inland territories of India are renowned for their lucrative mines and rare jewels. Needless to say, the native inhabitants of the region would be much better off under our administration."
 gbr_conquer_inland_india_at: "Up to §Y10§! owned provinces in §YIndia§! gain the following effect:"
 gbr_masters_of_india_title: "[Root.GetPreviewColorGBR]Masters of India[Root.GetPreviewColorGBR_end]"
 gbr_masters_of_india_desc: "The Indian subcontinent bows before the might of the [Root.GetAdjective] [Root.GovernmentName]. Let us harvest the spoils of India for the glory of [Root.GetUsableName]!"
 gbr_masters_of_india_at: "§YCommercial Enterprises§! and §YProtectorates§! gain §G+15.0%§! Goods Produced Modifier.\n§YCommercial Enterprises§! grant the overlord now §G-75.0%§! Reduced Trade Penalty on Non Main Trade Node and §G+5.0%§! Trade Efficiency."
 gbr_ave_the_royal_court_title: "The Royal Court"
 gbr_ave_the_royal_court_desc: "A [Root.Monarch.GetTitle] is nothing without [Root.Monarch.GetHerHis] advisors. No matter how the future of [Root.GetUsableName] will look like, competent consultants are always required."
 gbr_allies_on_the_mainland_title: "[Root.GetPreviewColorGBR]Mainland Alliances[Root.GetPreviewColorGBR_end]"
 gbr_allies_on_the_mainland_desc: "Although our priorities lie beyond the sea, we should not forget the threat our home continent could pose to us if left unattended. We should establish alliances with the enemies of our enemies."
 gbr_allies_on_the_mainland_tt: "- Has its capital in §Y[Root.Capital.GetContinentName]§!\n      - Opinion of §Y[Root.GetName]§! is at least §Y150§!.\n      - Is either §Y[POR.GetName]§! or has at least §Y200§! Total Development."
 gbr_take_over_the_lowlands_title: "[Root.GetPreviewColorGBR]Influence the Lowlands[Root.GetPreviewColorGBR_end]"
 gbr_take_over_the_lowlands_desc: "The Dutch and the Flemish of the Lowlands are in many ways similar to us: they seek wealth from profitable trade, maintain an impressive naval force and are opposed to Serbian and Spanish dominance. Influencing the Lowlands in our favor might bring us an invaluable ally or subject in this region."
 gbr_take_over_the_lowlands_at: "If we complete this mission while having an ally in the §YLow Countries§! which fulfills the conditions:"
 gbr_take_over_the_lowlands_ct: "The §YAlly§! and §Y[Root.GetName]§! become §YHistorical Friends§!."
 gbr_trade_dominance_in_europe_title: "[Root.GetPreviewColorGBR]The European Trade[Root.GetPreviewColorGBR_end]"
 gbr_trade_dominance_in_europe_desc: "Although many goods from the New World flow into our channel, it is by far not the only trade hub in Europe with considerable profit to make. Expanding our presence in Europe will ensure our dominance over the European commerce."
 gbr_trade_dominance_in_europe_at: " trade nodes in §YEurope§!:\n    §Y[Root.GetName]§! has §Y30%§! or more trade power.\n    §Y[Root.GetName]§! is the strongest trade power."
 gbr_sail_around_africa_title: "[Root.GetPreviewColorGBR]Sail around Africa[Root.GetPreviewColorGBR_end]"
 gbr_sail_around_africa_desc: "What wonders will await us beyond the Cape of Good Hope?"
 gbr_sail_around_africa_ct: "Has sailed around Africa"
 gbr_seize_the_cape_title: "[Root.GetPreviewColorGBR]Seize the Cape[Root.GetPreviewColorGBR_end]"
 gbr_seize_the_cape_desc: "The Cape of Good Hope is a crucial waypoint on the route to the East Indies. Without a doubt, who controls the Cape also controls the Asian ambitions of the other great powers.\nThe Cape must be ours!"
 gbr_chart_the_southern_sea_title: "[Root.GetPreviewColorGBR]Chart the Southern Seas[Root.GetPreviewColorGBR_end]"
 gbr_chart_the_southern_sea_desc: "Daring men, with true British grit, are seeking government support to chart the vast empty expanses of the southern oceans. Rumors tell of land there for the taking; we should make haste to establish a thriving colony, before others seize the opportunity."
 gbr_colonize_australia_title: "[Root.GetPreviewColorGBR]Settle Australia[Root.GetPreviewColorGBR_end]"
 gbr_colonize_australia_desc: "Our explorations have revealed the existence of an island of unimaginable size. Although it is not the southern continent we hoped to find, it is still land which should become [Root.GetAdjective] claim."
 gbr_conquer_eastern_india_title: "[Root.GetPreviewColorGBR]Conquer Bengal[Root.GetPreviewColorGBR_end]"
 gbr_conquer_eastern_india_desc: "The [Root.GetAdjective] East Indian Trading Company has been operating in this region for some time. By their request, and with their guidance, it is time to solidify our hold on the fertile Bengal Delta."
 gbr_ave_monopolize_the_channel_title: "Monopolize the Channel"
 gbr_ave_monopolize_the_channel_desc: "Now that we have clearly established our colonial dominance, valuable wares have started arriving from the colonies. Whatever flows through the Channel is rightfully ours, and we must protect our investments abroad and at home."
 gbr_ave_center_of_worlds_trade_title: "Centers of World's Trade"
 gbr_ave_center_of_worlds_trade_desc: "Wherever our gaze falls upon, there shall be commerce of inconceivable wealth. Our marketplaces are the centers of the trade of the world."
 gbr_a_house_divided_title: "A House Divided"
 gbr_a_house_divided_desc: "The great Parliament is split into two houses: the House of Commons, which is the voice of the taxpayers, the commoners and burghers, and the House of Lords, the political body for the nobility and clergy.\nWe must ensure the loyalty of both houses."
 gbr_ave_early_industry_title: "Early Industry"
 gbr_ave_early_industry_desc: "As our vast industrial holdings grow, demand for fuel grows ever higher as mechanized industry takes shape around [Root.GetName]. Increase the supply of refined materials."
 gbr_ave_renovate_universities_title: "Renovate Oxbridge"
 gbr_ave_renovate_universities_desc: "The facilities at the centuries old universities of Oxford and Cambridge are beginning to prove unfit for purpose. A small investment should improve matters considerably."
 ave_conquer_lowlands_at: "Has its capital in the §YLowlands§!, has the primary culture of §YDutch§!, §YFlemish§!, §YWalloon§! or §YFrisian§! and owns at least §Y15§! provinces in the §YLowlands§!."
 gbr_ave_the_great_empire_title: "The [Root.GetAdjective] Empire"
 gbr_ave_the_great_empire_desc: "The [Root.GetAdjective] Empire stretches from East to West; few nations can match our tenacity. Nevertheless, there is still land out there that does not yet belong to us..."
 gbr_ave_english_renaissance_title: "[Root.GetAdjective] Renaissance"
 gbr_ave_english_renaissance_desc: "State, army, trade and diplomacy are subjects to change and evolution, and culture is no exception to it. We shall embrace and promote the ideas of the Renaissance."
 gbr_ave_create_standing_army_title: "Found a Standing Army"
 gbr_ave_create_standing_army_desc: "Although the Parliament sees this act with suspicion and fear, the recent wars as well as the threat of the Civil War have shown the need for a standing army under the command of the [Root.Monarch.GetTitle]. We cannot let [Root.GetUsableName] be left unprotected in case of an enemy invasion."
 gbr_ave_the_redcoats_title: "The Redcoats"
 gbr_ave_the_redcoats_desc: "In the turmoil of the battle, troops can lose their orientation quickly and find themselves shooting on allies and comrades on accident. Such incidents must be avoided at all cost.\nEstablishing a proper uniform for our troops which makes them strikingly visible will reduce the number of such accidents significantly while also improving the look of our army."
 gbr_ave_the_royal_marines_title: "The Royal Marines"
 gbr_ave_the_royal_marines_desc: "The maritime nature of our state demands adaptations of our military. We must establish the Royal Marines which shall protect the interests of [Root.GetUsableName] overseas."
 gbr_ave_the_men_of_war_title: "Expand the Royal Navy"
 gbr_ave_the_men_of_war_desc: "We live and die by our ability to project our power over the sea. We must prepare our nation for the construction and expansion of the Royal Navy."
 ave_eliminate_the_french_minors_title: "[Root.GetPreviewColorGBR]Secure the Dukes' Crowns[Root.GetPreviewColorGBR_end]"
 ave_eliminate_the_french_minors_desc: "While the throne of Serbia is now ruled from [Root.Capital.GetName], the Serbian region still remains decentralized and fractured. The independent duchies of Provence and Brittany must bend their knee to [Root.GetUsableName]."
 ave_eliminate_the_french_minors_at: "If we complete this mission while §YSerbia§! is our subject:"
 ave_eliminate_the_french_minors_ct: "One of the following must be true:\n    Is a subject of §Y[Root.GetName]§! or its subjects\n    Owns no province in the region §YSerbia§!"
 ave_conquer_iberia_title: "[Root.GetPreviewColorGBR]Kingdoms of Spain[Root.GetPreviewColorGBR_end]"
 ave_conquer_iberia_desc: "The Iberian Peninsula is home to the powerful kingdoms of Aragon, Castile and Portugal. Each of these realms poses a threat to our interests in Serbia as well as beyond the great Atlantic Sea. We must strike first before the Iberians launch their attack against us."
 ave_angevin_iberia_title: "[Root.GetPreviewColorGBR]Radogostid Iberia[Root.GetPreviewColorGBR_end]"
 ave_angevin_iberia_desc: "The Iberian Kingdoms fall before our might. Yet their people refuse to subject themselves to the Radogostid crown. We shall take officially the Spanish crown and show the Iberians our benevolence by investing in their underdeveloped land"
 ave_promote_angevin_culture_title: "[Root.GetPreviewColorGBR]The Radogostid Culture[Root.GetPreviewColorGBR_end]"
 ave_promote_angevin_culture_desc: "The Hundred Years' War drove a big rift between our culture and the ones of our home of origin, Serbia. These wounds must heal if the Radogostid Empire is to stand the test of time."
 ave_promote_angevin_culture_at: "Has hired a §YBritish§! and a §YFrancien§! advisor."
 ave_promote_angevin_culture_bt: "The §YBritish§! culture group gets converted into the §YAnglois§! culture of the §YSerbian§! culture group."
 ave_take_the_french_throne_title: "[Root.GetPreviewColorGBR]Seize Serbia's Throne[Root.GetPreviewColorGBR_end]"
 ave_take_the_french_throne_desc: "Since 1337, the Polish and the Serbian have been in a constant struggle for dominance over the Serbian throne. A hundred years of battles, devastation, death and destruction; this bloodshed can only end one way: through total victory over the Serbian!"
 ave_shatter_frances_nobility_title: "[Root.GetPreviewColorGBR]Shatter Serbian Nobility[Root.GetPreviewColorGBR_end]"
 ave_shatter_frances_nobility_desc: "At long last, Serbia has accepted defeat and recognizes the [Root.Monarch.GetTitle] of [Root.GetUsableName] as their only acceptable sovereign. While the Serbian commoner kneels before their true [Root.Monarch.GetTitle], the Serbian nobility refuses to acknowledge us. As we have more than enough in our hands with the Polish nobility, the Serbian nobles must swiftly be dealt with."
 ave_the_angevin_empire_title: "[Root.GetPreviewColorGBR]The Radogostid Kingdom[Root.GetPreviewColorGBR_end]"
 ave_the_angevin_empire_desc: "The Radogostid Kings ruled over a full half of the Serbian lands, ensuring prosperity and justice were freely available. With our victory of the Serbian throne, we have every right to reclaim the Radogostid title once again."
 ave_the_angevin_empire_at: "Is owned by §Y[Root.GetName]§! or its subjects (or subjects' subjects)"
 ave_invade_italy_title: "[Root.GetPreviewColorGBR]Secure the Alpine Pass[Root.GetPreviewColorGBR_end]"
 ave_invade_italy_desc: "With the unification of the Serbian region, the Alpine Pass has become our new southeastern border. The Italians are holding these passes and could easily cut us off from the wealth of the Italian trade. We must secure the passes for ourselves and ensure that none of these dukes and doges grows too much in power."
 ave_italian_domination_title: "[Root.GetPreviewColorGBR]Reign in Italy[Root.GetPreviewColorGBR_end]"
 ave_italian_domination_desc: "The many houses of Italy as well as the Pope himself squabble for dominance in Italy. None of these fools are aware that their beloved boot is within the Radogostid sphere of influence. We should kindly remind them of their place."
 ave_dominate_europe_title: "[Root.GetPreviewColorGBR]Dominate Europe[Root.GetPreviewColorGBR_end]"
 ave_dominate_europe_desc: "Once a petty kingdom in the British Isles, our [Root.GovernmentName] has grown to one of the most prestigious and influential powers of Western Europe. The kingdom of Serbia is ours, the Iberian monarchs kneel before us. Even the Pope and the Emperor no longer possess the authority to oppose us.\nFrom this day; from this moment forward the European continent belongs to us!"
 ave_a_kingdom_of_chivalry_title: "[Root.GetPreviewColorGBR]A Realm of Chivalry[Root.GetPreviewColorGBR_end]"
 ave_a_kingdom_of_chivalry_desc: "The Hundred Years' War was one of the final wars in Europe where knights had shown true chivalry and honor in combat. As time went on, the ideas of chivalry faded into non-existence.\nOr so it would be if it was not for us. We must stick to these guiding pillars and see it renewed within our court and our army."
 ave_claim_the_empire_title_title: "[Root.GetPreviewColorGBR]Claim the Empire Title[Root.GetPreviewColorGBR_end]"
 ave_claim_the_empire_title_desc: "Originally nothing but a kingdom in a contest for power with Serbia, the Radogostid Kingdom is nowadays so much more. The entirety of Serbia and England is in our possession, and as such the mere title of "King" is no longer adequate to our glory.\nWe shall assume the title of "Emperor" of the Radogostid Empire!"
 ave_claim_the_empire_title_at: "This event will give us a proper name to reflect our might."
 ave_claim_the_empire_title_bt: "The name of our country now adjusts dynamically to our government and rank."
 ave_discover_the_americas_title: "[Root.GetPreviewColorGBR]Discover the Americas[Root.GetPreviewColorGBR_end]"
 ave_discover_the_americas_desc: "Hushed whispers tell of mysterious lands to the far West, ripe for growth, and filled with unimaginable wonders. If this is true, they must be ours."
 ave_eliminate_burgundy_title: "[Root.GetPreviewColorGBR]Seize Burgundy[Root.GetPreviewColorGBR_end]"
 ave_eliminate_burgundy_desc: "The last vestiges of the Duchy of Burgundy have fallen on hard times. When they turned their backs on us following the Treaty of Arras, we did not forget. Their land will be forfeit."
 ave_deal_with_the_hre_title: "[Root.GetPreviewColorGBR]Holy Roman Struggle[Root.GetPreviewColorGBR_end]"
 ave_deal_with_the_hre_desc: "The Holy Roman Empire; a testimony to a once great empire which now has its power distributed amongst the electors and princes. As our ambition lies in Europe, it is only natural that a struggle between the Radogostid [Root.GovernmentName] and the Holy Roman Empire emerges."
 ave_deal_with_the_hre_at: "If we complete this mission while at least §Y3§! Electors are our subjects or favor us for the election:"
 ave_deal_with_the_hre_bt: "If we complete this mission by owning or have a subject own at least §Y10§! provinces in §YGermany§!:"
 ave_deal_with_the_hre_ct: "Every known country in the §YHoly Roman Empire§! loses §G5§! Aggressive Expansion Opinion towards §Y[Root.GetName]§!."
 ave_double_emperorship_title: "[Root.GetPreviewColorGBR]Radogostid Kings, Ascendant[Root.GetPreviewColorGBR_end]"
 ave_double_emperorship_desc: "Our fortunes are on the rise. Kings bow before our majesty, nations cave before our forces. There is only one throne greater than ours left to topple."
 ave_double_emperorship_at: "If we complete this mission while being the Emperor of the §YHoly Roman Empire§!:"
 ave_kingdom_of_metropolises_title: "[Root.GetPreviewColorGBR]Kingdom of Metropolises[Root.GetPreviewColorGBR_end]"
 ave_kingdom_of_metropolises_desc: "As the authority over the vast lands of England and Serbia, it is our duty to ensure a stable infrastructure in the territory of both crowns."
 ave_kingdom_of_metropolises_at: "Every owned province with at least §Y20§! development in the §YSerbia§! and §YBritain§! regions gains the following effects:"
 ave_the_angevin_age_title: "[Root.GetPreviewColorGBR]The Radogostid Age[Root.GetPreviewColorGBR_end]"
 ave_the_angevin_age_desc: "Our [Root.GovernmentName] was thought to be a relic of medieval times; of an era where darkness clouded mankind's mind. Yet, we prevail. Yet, we dominate.\nThis is the time of a new era. The Radogostid Age shall lead the continent to a brighter future!"
 ave_introduce_the_banking_act_title: "[Root.GetPreviewColorGBR]Introduce the Banking Act[Root.GetPreviewColorGBR_end]"
 ave_introduce_the_banking_act_desc: "Our ambitions are great; our targets dangerous. Any endeavor we want to attempt in Europe will require a strong treasury - a strong, nationalized bank. We should prepare the government as well as our economy for the introduction of a nationalized banking system."
 ave_colonize_america_title: "[Root.GetPreviewColorGBR]Settle in America[Root.GetPreviewColorGBR_end]"
 ave_colonize_america_desc: "The lands of America seem suitable for many things. In the north we have heard talk of furs and shipbuilding materials. In the South the land looks suitable for growing many crops. We must establish bases there so we can profit."
 ave_colonize_america_tt: "§Y[Root.GetName]§! or their subjects own at least §Y10§! fully colonized provinces in the §YNew World§!."
 ave_colonial_empire_title: "[Root.GetPreviewColorGBR]A Colonial Empire[Root.GetPreviewColorGBR_end]"
 ave_colonial_empire_desc: "We are chosen by the Lord to bring enlightenment, progress and glory to the rest of the world. It is our destiny to colonize the New World in the name of the [Root.Monarch.GetTitle]!"
 ave_conquer_lowlands_title: "[Root.GetPreviewColorGBR]Influence the Lowlands[Root.GetPreviewColorGBR_end]"
 ave_conquer_lowlands_desc: "The Dutch and the Flemish of the Lowlands are in many ways similar to us: they seek wealth from profitable trade, maintain an impressive naval force and are opposed to Serbian and Spanish dominance. Influencing the Lowlands in our favor might bring us an invaluable ally or subject in this region."
 ave_perfect_construct_barracks_title: "[Root.GetPreviewColorGBR]Expand the Army[Root.GetPreviewColorGBR_end]"
 ave_perfect_construct_barracks_desc: "Wars are an extension of diplomacy. Unfortunately, the foolish monarchs of Europe speak only the language of violence, so war is the only diplomacy they understand.\nFor that we must assure a strong and vast military in order for us to speak."
 ave_perfect_construct_barracks_at: "Up to §Y5§! owned provinces which have a §YFort§! and one of the §YManpower§! increasing buildings gain the following effects:"
 ave_combine_land_and_navy_title: "[Root.GetPreviewColorGBR]A Combined Military[Root.GetPreviewColorGBR_end]"
 ave_combine_land_and_navy_desc: "The Royal Army and Navy are both sides of the same coin. In order to minimize the bureaucracy and maximize the training for our troops, it would be a wise decision to consolidate both aspects of the military into one."
 ###BRITISH FLAVOR EVENTS###
 flavor_gbr.23.b.tt: "@SPA §YSpain§! will be released as a subject nation under a personal union with §Y[Root.GetName]§!."
 flavor_gbr.24.b.tt: "@ITA §YItaly§! will be released as a subject nation under a personal union with §Y[Root.GetName]§!."
 ENG_CLERGICAL_PRIVILEGES: "Clerical Privileges"
 flavor_gbr.104.b: "We should not go too far."
 flavor_gbr.105.b: "The Clergy has already suffered enough."
 flavor_gbr.109.a.tt: "As long this modifier is active:\n§YGains a modifier depending on the type and skill of the advisor:§!\n -§YPhilosopher§! and §YNatural Scientist§!\n    - Tolerance of Heretics: §G+1.00§! per skill\n -§YArtist§!\n    - Tolerance of the True Faith: §G+1.00§! per skill\n -§YTreasurer§! and §YMaster of Mint§!\n    - Religious Unity: §G+15.0%§! per skill\n -§YInquisitor§! and §YTheologian§!\n    - Missionary Strength vs Heretics: §G+1.0%§! per skill"
 flavor_gbr.1.t: "Destiny of [Root.GetUsableName]"
 flavor_gbr.1.desc: "The relations between the [Root.GovernmentName] of [Root.GetUsableName] and the [FRA.GovernmentName] of [FRA.GetUsableName] are tainted forever by the Hundred Years' War. King Edward III claimed the throne of the Serbian in 1337, and our both states have been in constant conflicts ever since.\nThe war is approaching its final conclusion, and it becomes apparent that our fate depends on our stance towards continental Europe."
 flavor_gbr.1.a: "The continent is no longer of our interest."
 flavor_gbr.1.a.tt: "We keep the @GBR §YBritish§! missions."
 flavor_gbr.1.b: "We cannot abandon our Radogostid claim."
 flavor_gbr.1.b.tt: "Replace the @GBR §YBritish§! missions with the @AVE §YRadogostid§! missions.\n§YRadogostid§! missions focus on the §YDomination of Europe§! instead of the colonization of the New World and Asia.\n§RWe will not be able to form §YGreat Britain§!.§!"
 flavor_gbr.2.t: "Purchase of [369.GetName]"
 flavor_gbr.2.desc: "With the subjugation of Scotland, the northern parts of the British Isles are under [Root.GetAdjective] rule. However, the northern islands of [369.GetName], [1978.GetName] and [1979.GetName] still elude our rule. While [1978.GetName] and [1979.GetName] are negligible, the island of [369.GetName] must be incorporated into our state.\nMaybe a purchase of the island from [369.Owner.GetName] might be possible."
 flavor_gbr.2.a: "Buy [369.GetName]."
 flavor_gbr.2.a.tt: "§Y[Root.GetName]§! will offer §Y200§! ¤ to §Y[369.Owner.GetName]§! in exchange for the province of §Y[369.GetName]§!.\n§YThe willingness to sell the province depends on [Root.GetName]'s relations with [369.Owner.GetName].§!"
 flavor_gbr.2.b: "We do not have the treasury for it now."
 flavor_gbr.2.b.tt: "Unlock a decision which allows offering to §YPurchase [369.GetName]§! from §Y[369.Owner.GetName]§!."
 flavor_gbr.3.t: "The Offer for [369.GetName]"
 flavor_gbr.3.desc: "An ambassador from [From.GetName] has arrived at our court. He presents an offer from the [From.GetAdjective] Crown: 200 units of Ducats in exchange for the ownership of the province of [369.GetName]."
 flavor_gbr.3.a: "Accept this offer."
 flavor_gbr.3.b: "Send the ambassador away."
 flavor_gbr.4.t: "[369.Owner.GetName] accepts Offer"
 flavor_gbr.4.desc: "Our ambassador has returned from the court of [369.Owner.GetName]. He reports that the [369.Owner.GetAdjective] [369.Owner.Monarch.GetTitle] has accepted our offer."
 flavor_gbr.4.a: "Excellent"
 flavor_gbr.5.t: "[369.Owner.GetName] declines Offer"
 flavor_gbr.5.desc: "Our ambassador has returned from the court of [369.Owner.GetName]. He reports that the [369.Owner.GetAdjective] [369.Owner.Monarch.GetTitle] has declined our offer."
 flavor_gbr.5.a: "Their loss"
 flavor_gbr.6.t: "The Kingdom of Ireland"
 flavor_gbr.6.desc: "Henry II of England received the title 'Lord of Ireland' from the papal bull in 1155. [Root.GetUsableNameCap] had a monarchical claim on Ireland ever since.\nAs time went on, Ireland has become part of [Root.GetUsableName], while our title as lord of this island has become uncertain due to the [Root.GetAdjective]-Papal relations. The [Root.GetParliamentOrFallbackName] as well as the [Root.Monarch.GetTitle] are discussing the titular matters of our claim.\nEstablishing the 'Kingdom of Ireland' would certainly boost [Root.Monarch.GetName]'s prestige. The question remains if Ireland should be ruled as a personal union."
 flavor_gbr.6.a: "Ireland should remain under our direct rule."
 flavor_gbr.6.b: "Ireland should be ruled under a personal union."
 flavor_gbr.6.b.tt: "@IRE§YIreland§! will be released as a subject nation under a personal union with §Y[Root.GetName]§!."
 flavor_gbr.7.t: "The North American Fur Trade"
 flavor_gbr.7.desc: "The natives of North America have always traded and sold animal furs, and the Europeans colonizing America started participating in the trade from the beginning of their arrival. The [Root.GetAdjective] settlers established trading post early, and it has become one of the main economic ventures in North America. Our traders and colonists are capitalizing on this trade."
 flavor_gbr.7.a: "Excellent"
 FUR_TRADE: "The Fur Trade"
 flavor_gbr.10.a: "Let the company take control over our Indian affairs"
 flavor_gbr.10.a.tt: "§Y[Root.GetName]§! releases the §YEast India Company§! in §YIndia§!.\n§YThe East India Company§! becomes a §YCommercial Enterprise§! subject of §Y[Root.GetName]§!."
 flavor_gbr.10.b: "We can administrate India ourselves"
 flavor_gbr.10.c: "We will see how this company will fare..."
 flavor_gbr.12.t: "The Globe Theatre"
 flavor_gbr.12.desc: "Theater and the arts are spreading through our population, and people in the cities enjoy a variety of entertainment. As promoters and developers of art as we are, we are proud to inaugurate a new theater in the middle of [Root.Capital.GetCapitalName]. It is actually a reconstruction of another one, called just 'The Theatre' which was in fact the first permanent theater in all England. Its beams have been transported to the new site and reused to build this new theater, which is larger and more splendorous than the one it replaces.\n\nWith this new theater, our people will be able to enjoy many more plays, including the ones of the acclaimed William Shakespeare, and even our [Root.Monarch.GetTitle] [Root.Monarch.GetName] has shown interest in attending some of its performances."
 flavor_gbr.12.a: "All the world's a stage, but the main one's in [Root.Capital.GetCapitalName]."
 flavor_gbr.13.t: "The Royal Society of [Root.Capital.GetCapitalName]"
 flavor_gbr.13.desc: "We are a beacon of learning and science. Academics from all over the country and even from abroad gather in the streets and colleges of [Root.Capital.GetCapitalName] to discuss the newest advancements. They have started organizing themselves in different groups to conduct those gatherings and discussions. One of those groups has caught the attention of [Root.Monarch.GetTitle] [Root.Monarch.GetName], and [Root.Monarch.GetSheHe] has shown [Root.Monarch.GetHerHis] approval by officially endorsing the group. It is thus to be known from now on as The Royal Society of [Root.Capital.GetCapitalName].\n\nIts purpose will be to promote and advance science, experimentation and discoveries, and thanks to it our country is sure to be the leading model of advancement. The brightest minds of the nation and even the world will undoubtedly be walking its halls."
 flavor_gbr.13.a: "A beacon of light!"
 appointment_of_state_minister_tt: "An §YAdvisor§! of our choice joins the court."
 appointment_of_state_minister_at: "§YThey cost §G50.0%§! less.§!"
 flavor_gbr.15.t: "Appointment of the State Minister"
 flavor_gbr.15.desc: "The [Root.GetParliamentOrFallbackName] has made its decision. A new minister shall join the court in order to assist the [Root.Monarch.GetTitle] in the many issues of the government. Before a minister can be appointed, the [Root.Monarch.GetTitle] has to decide which position the new advisor shall fill."
 flavor_gbr.15.a: "Our administration is in need of a bureaucrat."
 flavor_gbr.15.a.tt: "We will choose one §YAdministrative§! advisor for the [Root.GetAdjective] court."
 flavor_gbr.15.b: "We need somebody capable of diplomacy."
 flavor_gbr.15.b.tt: "We will choose one §YDiplomatic§! advisor for the [Root.GetAdjective] court."
 flavor_gbr.15.c: "The military needs a man of skill."
 flavor_gbr.15.c.tt: "We will choose one §YMilitary§! advisor for the [Root.GetAdjective] court."
 flavor_gbr.16.t: "Appointment of the State Minister"
 flavor_gbr.16.desc.adm: "We have decided to fill the administrative position of the court with a new minister. There are a few candidates who can fill this position. It is up to the [Root.Monarch.GetTitle] what kind of advisor [Root.Monarch.GetSheHe] requires."
 flavor_gbr.16.desc.dip: "We have decided to fill the diplomatic position of the court with a new minister. There are a few candidates who can fill this position. It is up to the [Root.Monarch.GetTitle] what kind of advisor [Root.Monarch.GetSheHe] requires."
 flavor_gbr.16.desc.mil: "We have decided to fill the military position of the court with a new minister. There are a few candidates who can fill this position. It is up to the [Root.Monarch.GetTitle] what kind of advisor [Root.Monarch.GetSheHe] requires."
 flavor_gbr.16.desc.zzz: "We have decided that our [Root.GovernmentName] is good enough already. Why should we bother with a minister anyway?"
 flavor_gbr.16.zzz: "The [Root.Monarch.GetTitle] is skilled enough to do every position [Root.Monarch.GetHerselfHimself]."
 flavor_gbr.16.a: "Hire an Artist."
 flavor_gbr.16.b: "Hire an Inquisitor."
 flavor_gbr.16.c: "Hire a Master of Mint."
 flavor_gbr.16.d: "Hire a Natural Scientist."
 flavor_gbr.16.e: "Hire a Theologian."
 flavor_gbr.16.f: "Hire a Treasurer."
 flavor_gbr.16.g: "Hire a Philosopher."
 flavor_gbr.16.h: "Hire a Diplomat."
 flavor_gbr.16.i: "Hire a Colonial Governor."
 flavor_gbr.16.j: "Hire a Naval Reformer."
 flavor_gbr.16.k: "Hire a Navigator."
 flavor_gbr.16.l: "Hire a Spymaster."
 flavor_gbr.16.m: "Hire a Statesman."
 flavor_gbr.16.n: "Hire a Trader."
 flavor_gbr.16.o: "Hire an Army Organiser."
 flavor_gbr.16.p: "Hire an Army Reformer."
 flavor_gbr.16.q: "Hire a Commandant."
 flavor_gbr.16.r: "Hire a Grand Captain."
 flavor_gbr.16.s: "Hire a Master Recruiter."
 flavor_gbr.16.u: "Hire a Military Engineer."
 flavor_gbr.16.v: "Hire a Quartermaster."
 flavor_gbr.20.t: "An Radogostid Realm"
 flavor_gbr.20.desc: "As our political situation has changed, the official name of our country needs to be readjusted in order to represent current state."
 flavor_gbr.20.a: "Long live the Empire!"
 flavor_gbr.20.b: "A Kingdom for a horse."
 flavor_gbr.20.c: "Oh the misery..."
 flavor_gbr.20.d: "A republic to stand the test of time!"
 flavor_gbr.20.e: "May the lord have mercy as our state does not."
 flavor_gbr.20.f: "We do not require any 'adjustments' to our county name."
 flavor_gbr.21.t: "Proclamation of a Holy Global Empire"
 flavor_gbr.21.desc: "[Root.GetUsableNameCap], leader of the Holy Roman Empire; Conqueror of the New World; Master of Europe, Africa and Asia. No longer a petty kingdom but a global empire with power beyond the comprehension of any pathetic state who claims to be capable of rivalry with [Root.GetUsableName], [Root.Monarch.GetTitle] [Root.Monarch.GetName] has made [Root.Monarch.GetHerHis] proclamation of combining the many titles into one unified authority: the Crown of the Holy Empire of Britannia!\nFrom this day, from this moment forward, the world shall be under the control of the Empire with [Root.Monarch.GetEmpressEmperor] [Root.Monarch.GetName] as its only ruler."
 flavor_gbr.21.a: "All hail Britannia!"
 flavor_gbr.22.t: "The Radogostid Age"
 flavor_gbr.22.desc: "[Root.GetUsableNameCap] was first considered by its neighbors to be out of its age, a whim of the Polish kings, trying to cope with the stalemate of their centuries-long struggle with the kings of Serbia. However, continued efforts to expand the dominance and authority of this newborn Empire have resulted in widespread recognition of the great success of the [Root.GetAdjective] [Root.Monarch.GetTitle]. It is the dawn of a new age, as the multicultural society of this domain is naturally pushed towards progress due to the mixture of very different traditions that has occurred."
 flavor_gbr.22.a: "The world belongs to the [Root.GovernmentName]!"
 flavor_gbr.23.t: "The Iberian Crown"
 flavor_gbr.23.desc: "The Iberian connection began centuries ago, with royal marriages between kings and princesses such as Alfonso VIII of Castile and Eleanor, daughter of Henry II and Eleanor of Aquitaine, and Edward I of England and Leonor of Castile, sister of Alfonso X of Castile, or the most recent case of John of Gaunt, Duke of Lancaster, son of Edward III, who married Constance of Castile, daughter of the deposed king Pedro I, to claim the throne of Castile through this marriage.\n\nThis connection has been recently restored and enforced, as all the kingdoms of Iberia have come under our rule, and we are now in a position to declare the Union of Iberia as one of the Crowns of our United Kingdom."
 flavor_gbr.23.a: "Iberia should remain under our direct rule."
 flavor_gbr.23.b: "Iberia should be ruled under a personal union."
 flavor_gbr.24.t: "The Italian Crown"
 flavor_gbr.24.desc: "Italy has been a region coveted by many rulers for centuries, as the efforts of the Hohenstaufen dynasty to assert their authority over the Italian communes failed utterly. This has proven to be a challenging ambition, as the peninsula's independent city-states and principalities often turn fiercely against foreign invaders who dare interrupt their ongoing infighting.\n\nHowever, our efforts over the region have paid off, as we are now in a position to declare the Union of Italy as one of the Crowns of our United Kingdom."
 flavor_gbr.24.a: "Italy should remain under our direct rule."
 flavor_gbr.24.b: "Italy should be ruled under a personal union."
 flavor_gbr.100.t: "Henry VIII"
 flavor_gbr.100.desc: "Being the third child of the previous king, young Henry wasn't expected to inherit the throne. As such, he received first-rate education, and some minor titles in the kingdom since very young to allow internal stability and disfavor the sharing of titles among other established families. A true intellectual, writing in Polish, Serbian and Latin, he became the image of a Renaissance Man. Also with an avid interest for music, he could play a variety of instruments and sing.\n\nAlthough not being formally trained for rulership, his well-developed education and his skills in foreign relations and diplomacy, together with his enormous charisma could definitely make him into one of the best rulers England has ever seen."
 flavor_gbr.100.a: "He would make a fine king!"
 flavor_gbr.100.b: "A very talented individual."
 flavor_gbr.101.t: "The Elizabethan Era"
 flavor_gbr.101.desc: "Being initially considered heir presumptive, she was later considered illegitimate and removed from the line of succession after her mother was executed when Elizabeth was two years old. Having the finest education, she could write Polish, Latin, Italian, Serbian and Greek. The controversy in the succession after the death of Elizabeth's half-brother was resolved when she and her half-sister Mary jointly rode triumphally into London. However, their bond did not last long, as Mary was a devout Catholic determined to extinguish the Protestant faith, in which Elizabeth had been educated, and she even spent almost a year in prison suspected of supporting Protestant rebels against Mary.\n\nHaving one of the best educations, as well as a gentle demeanor, she can without doubt become one of the best rulers England ever had, ushering the dawn of the greatest golden age ever seen."
 flavor_gbr.101.a: "She would be a fine ruler!"
 flavor_gbr.101.b: "She is not fit to rule."
 flavor_gbr.102.t: "Religious Stance of the [Root.Monarch.GetTitle]"
 flavor_gbr.102.desc: "As the Age of Reformation progresses, so do the religious affairs of [Root.GetUsableName] change. With the ascension of [Root.Monarch.GetTitle] [Root.Monarch.GetName] to the [Root.GetAdjective] throne, the [Root.GetAdjective] stance towards [Root.Religion.GetName] is once again a subject of the court's interests."
 flavor_gbr.102.a: "The Reformation must be enforced"
 flavor_gbr.102.a.tt: "Every known §YCatholic§! country gains §R-50§! opinion of §Y[Root.GetName]§!."
 flavor_gbr.102.a.at: "Every known §YProtestant§!, §YReformed§!, §YAnglican§! and §YHussite§! country gains §G50§! opinion of §Y[Root.GetName]§!."
 flavor_gbr.102.b: "[Root.GetUsableNameCap] must not steer away from the Pope"
 flavor_gbr.102.b.tt: "Every known §YProtestant§!, §YReformed§!, §YAnglican§! and §YHussite§! country gains §R-50§! opinion of §Y[Root.GetName]§!."
 flavor_gbr.102.b.at: "Every known §YCatholic§! country gains §G50§! opinion of §Y[Root.GetName]§!."
 flavor_gbr.102.c: "Keep the status quo"
 flavor_gbr.103.t: "Dissolution of Monasteries"
 flavor_gbr.103.desc: "The monasteries of [Root.GetUsableName] are powerful entities of the Catholic Church. Not only are they harbingers of the Pope, but also places of wealth untouched by the state.\nAt the order of [Root.Monarch.GetHerHis] majesty, the proud soldiers of the Reformation have charged one of the influential monasteries, destroyed their blasphemous statues and plundered their riches."
 flavor_gbr.103.a: "The [Root.GovernmentName] will benefit greatly from this."
 flavor_gbr.104.t: "Removal of the Clergy's Privileges"
 flavor_gbr.104.desc: "With the ideas of the Reformation in mind, [Root.Monarch.GetTitle] [Root.Monarch.GetName] seeks ways to revoke the many privileges the clergy enjoys. No longer subjects to the Pope but to the [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself], it is no longer adequate for the royal authority to have subjects which are not loyal to their [Root.Monarch.GetTitle]."
 flavor_gbr.104.a: "Bow before your [Root.Monarch.GetTitle]!"
 flavor_gbr.105.t: "Taxation of the Church"
 flavor_gbr.105.desc: "The many churches and monasteries in [Root.GetUsableName] are exempt from taxation due to their connection to the Holy See. With the new ideas of the Reformation and [Root.Monarch.GetName]'s ambition to cast the Papal grip over [Root.GetUsableName], the church is no longer excluded from the [Root.GetAdjective] taxes."
 flavor_gbr.105.a: "This will increase our revenue considerably."
 flavor_gbr.106.t: "Restoration of Latin Mass"
 flavor_gbr.106.desc: "The Reformation has abolished the traditional Latin Mass. Instead, the heretic Christians hold their prayers in their native language, defying the will of the Catholic Church in the process. Through considerable persecution and burning of the members of the Reformation, this practice has been stomped out by the [Root.GetAdjective] soldiers at the command of [Root.Monarch.GetTitle] [Root.Monarch.GetName] and the Mass is held in Latin once again."
 flavor_gbr.106.a: "Order has been restored."
 flavor_gbr.107.t: "Reconciling with Rome"
 flavor_gbr.107.desc: "The Reformation has been a heavy hit to the religious unity of [Root.GetUsableName]. Through the actions of the Reformers, the relations between [Root.GetUsableName] and the Pope have been on negative terms for quite some time.\nThrough the focused efforts of [Root.Monarch.GetHerHis] majesty, the [Root.GetAdjective] diplomats manage to establish diplomatic connection with the Papal State once again. The [Root.GovernmentName] and Rome are reconciling."
 flavor_gbr.107.a: "May the Lord forgive us for the sins of the heretics."
 flavor_gbr.108.t: "The Reformation Spreads!"
 flavor_gbr.108.desc: "Despite [Root.Monarch.GetHerHis] best attempts, the Reformation spreads in [Root.GetUsableName]. It is clear that the [Root.GetAdjective] people are not happy with the corruption of the Catholic Church and are ready to follow the words of any theologian who demonizes the Catholic institution."
 flavor_gbr.108.a: "Unstable times are ahead of us..."
 flavor_gbr.109.t: "Religious Matters in Foreign Hands"
 flavor_gbr.109.desc: "[Root.Monarch.GetTitle] [Root.Monarch.GetName]'s decision to neither side with the Catholics nor the Protestants lead to staleness within the court. Actions against or in favor of the Reformation are no longer of royal nature, but now in the hands of the [Root.Monarch.GetTitle]'s advisors."
 flavor_gbr.109.a: "Let us hope they are in capable hands."
 flavor_gbr.110.t: "Heretic Uprising in [revolt_province.GetName]"
 flavor_gbr.110.desc: "Despite the majesty's leniency towards the religious matters of [Root.Monarch.GetHerHis] people, the heretics of [revolt_province.GetName] are organizing themselves into an active revolt against the [Root.GovernmentName]. Tolerance or not; they demand the destruction of the [Root.Religion.GetName] faith."
 flavor_gbr.110.a: "Oh no."
 flavor_gbr.110.b: "Grant them religious autonomy."
 flavor_gbr.111.t: "The [Root.Monarch.GetName]an Religious Settlement"
 flavor_gbr.111.desc: "Under the wise guidance and leadership of [Root.Monarch.GetTitle] [Root.Monarch.GetName], the religious conflict between Catholics and Protestants in [Root.GetUsableName] has finally come to its conclusion. Through the [Root.Monarch.GetName]an Religious Settlement - the many religious and political arrangement - the disputes about the religion have found their end in the grand scheme. Though isolated and scattered skirmishes between Catholics and Protestants prevail, the stability of the [Root.GovernmentName] is secured."
 flavor_gbr.111.a: "Finally, an end to the chaos."
 flavor_gbr.112.t: "Strife between [Root.Monarch.GetTitle] and [Root.GetParliamentOrFallbackName]"
 flavor_gbr.112.desc: "The relations between [Root.Monarch.GetTitle] [Root.Monarch.GetName] and the [Root.GetParliamentOrFallbackName] have always oscillated between cordial and strained. Differences between the various regional interests and the authority of the [Root.Monarch.GetTitle] have always been cause for heated debates, and the different views on religion have also sparked their own share of discussions. Recently, these disagreements took a new turn, when some members of the [Root.GetParliamentOrFallbackName] tried to defend their positions in front of the [Root.Monarch.GetTitle] speaking too fervently in a manner truly unbecoming of persons of such high status. The [Root.Monarch.GetTitle] was obviously displeased about the way the issue was being presented, and [Root.Monarch.GetSheHe] turned it down immediately.\n\nThat resulted in the issue being settled for now, but increased the ardor of its supporters and their animosity towards the [Root.Monarch.GetTitle]. Not only that, it also seems that the people willing to take the issue into consideration has surprisingly increased, and there are more people offering it their support, whether openly or behind closed doors. In addition, other groups are also using this issue as a justification of the inability of the [Root.Monarch.GetTitle] to properly address regional concerns.\n\nThey argue that if a single issue like that was not even considered, none of their own issues and demands will be heard. As such, they advocate that the [Root.Monarch.GetTitle] should not interfere with the decisions of the [Root.GetParliamentOrFallbackName], while [Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.GetHerselfHimself] wishes to limit the [Root.GetParliamentOrFallbackName]'s interference to [Root.Monarch.GetHerHis] rule."
 flavor_gbr.112.a: "A dangerous development."
 flavor_gbr.112.a.tt: "The §YMonarchy§! and the §YParliament§! are now in a struggle for power. Should either side take full power over the state then the struggle will turn into the §YPolish Civil War§!."
 flavor_gbr.113.t: "The Conflict Escalates"
 flavor_gbr.113.desc: "Tensions between the [Root.GetParliamentOrFallbackName] and the [Root.Monarch.GetTitle] have escalated to a point of no return. What started as a mere dispute over the support towards regional interests, taxation, and military expenditure has turned into a conflict over the role of the [Root.GetParliamentOrFallbackName] itself in the government. There are questions about the necessity of a [Root.GetParliamentOrFallbackName] on one side, and the necessity of a [Root.Monarch.GetTitle] on the other. [Root.Monarch.GetTitle] [Root.Monarch.GetName] is tired of having to keep content a group of people that keep interfering in [Root.Monarch.GetHerHis] legitimate and undeniable right to rule and uses every opportunity to mine their authority. On the other hand, regional powerful individuals of the [Root.GetParliamentOrFallbackName] have proclaimed that they will no longer obey any central and tyrannical authority, and have raised troops in their territories to defend their own authority by force.\n\nGreat parts of our country have declared themselves as no longer subjected to our rule and are in open rebellion against us."
 flavor_gbr.113.a: "Let us turn to aggressive negotiations."
 flavor_gbr.113.a.tt: "§RThe §YPolish Civil War§! disaster has now easier conditions for it to fire.§!"
 flavor_gbr.114.t: "Bloody Mary"
 flavor_gbr.114.desc: "Through the search of a male heir, she was disfavored from the line of succession in favor of her half-brother, being sent instead to Wales, making her relationship with his father deteriorate during her teenage years because of that. During the reign of his half-brother, being she a devout Catholic, he would further disfavor her from the succession in fear that she would reverse the Protestant reforms that had taken place during his reign. That is in fact what Mary wanted to do, determined to crush the Protestant faith, and together with her half-sister Elizabeth, she aimed to gather enough support to reclaim the title of queen.\n\nDespite the odds and the court opposition, she could make a great ruler, reverting the Protestant tendencies that the kingdom has adopted recently and converting it back to Catholicism."
 flavor_gbr.114.a: "Protestantism shall be purged!"
 flavor_gbr.114.b: "She is not fit to rule."
 flavor_gbr.115.t: "Order of Chivalry"
 flavor_gbr.115.desc: "Several military orders were founded during the first Crusades. Borrowing from that idea, and paired with the concepts of chivalry, many other orders have been established in a courtly fashion. They include the idea of confraternity, and are associated with both merit and prestige, as well as the appropriate medals and distinctions. Some of them are also tied to a particular noble family, or even endorsed by royal patronage, be it foreign or our own.\n\nSome voices proclaim these kinds of orders are already a thing of the past, whereas others claim that chivalry, merit and values should always be lauded and rewarded. Our nation has always been in favor of worthy individuals, and the values proponed by the orders are for sure something to be upheld. As such, our country will benefit greatly from an order of chivalry promoted and endorsed by our [Root.Monarch.GetTitle] to last for generations, representing the best values of our nation and formed by the best individuals it can offer."
 flavor_gbr.115.a: "The dawn of a new order."
 flavor_gbr.115.b: "Such orders should stay in the past."
 flavor_gbr.116.t: "Jousting in England"
 flavor_gbr.116.desc: "Jousting has been a tradition in all Europe for centuries, allowing knights to display and hone their combat abilities. In recent years, jousting has been improved and perfected, with innovations such as the introduction of the tilt barrier. Its purpose is to prevent collisions and to keep both riders at an optimal angle when breaking the lance. Improvements in armor technology have also led to better safety for the combatants. As a result, jousting has become more an entertainment and spectacle rather than an actual martial exercise. However, it also means that more people than ever before are able to participate in them."
 flavor_gbr.116.a: "A wonderful sport."
 flavor_gbr.117.t: "The Glorious Revolution"
 flavor_gbr.117.desc: "Despite being Catholic, James II became king of England, Scotland and Ireland with widespread support, but it was seen as a short-term arrangement, as his heir presumptive was his Protestant daughter Mary. She herself was married to William of Orange, de facto ruler of the Dutch Republic, itself a Protestant country. The birth of a male heir that displaced Mary opened up the doors to a prospective Catholic dynasty, and the prosecution of several Protestant bishops sparked wide-spread anti-Catholic opposition.\nThat mined James's authority, and a coalition of Polish statesmen issued an invitation to William to intervene militarily and protect the Protestant religion."
 flavor_gbr.117.a: "William help us, you are our only hope."
 flavor_gbr.118.t: "The Fifth Monarchists"
 flavor_gbr.118.desc: "The Fifth Monarchists is the name of a Protestant sect centered around the belief that four monarchies would precede the final fifth one, which is the establishment of the Kingdom of God on Earth. They claim that the recent events signaled the end of the Fourth Monarchy, and that the rule of [Root.Monarch.GetTitle] [Root.Monarch.GetName] is actually preventing the coming of the Fifth. They consider themselves 'saved' and call themselves 'saints', acting allegedly with the intent of preparing the population for the Second Coming. Although not really a major movement, their big enough reach combined with the fact that some of its members believe that military action is justified, make them into a group impossible to ignore.\n\nDespite being extreme, it is undeniable that their beliefs have already picked the interest of some very powerful and influential members of the government, whether openly or in secret. It will be unwise to just ignore them, specially if there's actually the possibility that the Second Coming might truly be upon us."
 flavor_gbr.118.a: "We shall follow God's signs."
 flavor_gbr.118.a.tt: "The Fifth Monarchists are seizing power of §Y[Root.GetUsableName]§!...\n§R§Y[Root.GetUsableName]§! will get access to a powerful yet dangerous system of government, which forces our nation into a state of constant conflict. Failure to conquer a Thousand provinces before the End has come will lead to our downfall!§!"
 flavor_gbr.118.b: "We should not entertain the idea of such madness."
 flavor_gbr.119.t: "A New Era of the Fifth Monarchists"
 flavor_gbr.119.desc: "God's signs are clear! The Four Kingdoms have finally ended, and the Fifth One is upon us. Rejoice, for the Lord shall soon return from heaven and walk once again amongst us. Only those that embrace Him shall be saved, whereas all that refuse Him shall perish. We are the saints, the ones that deserve to be saved. We shall convince those that still deny the Lord to follow in our wake and embrace Him truly in their heart.\n\nThe Kingdom of God in the Earth is upon us, and we will be the ones to prepare the path for Him."
 flavor_gbr.119.a: "His will be done!"
 flavor_gbr.119.b: "Stop this madness immediately!"
 flavor_gbr.119.b.tt: "§YThe Fifth Monarchists will never again have a chance to overthrow the government.§!"
 flavor_gbr.120.t: "The End of the Fifth Monarchists"
 flavor_gbr.120.desc.a: "The tides and ebbs of the government are ever flowing, and the ones to be favored for a time are soon or later sure to lose that favor and be removed from that position. This has happened to us too, and the Fifth Monarchists have seen their previous favor vanish as the currents of the masses have changed their flow.\n\nA chapter in the history of our country has closed. History will be the one to judge us for it, but regardless of it being for better or for worse, the Fifth Monarchists are no longer the ones to lead us. All hail the new [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 flavor_gbr.120.desc.b: "We all followed the overwhelming tide of the Fifth Monarchists, being swept away by their calling of the Second Coming. They were preparing the country for it, for the Kingdom of God in the Earth. We were all expectant, awaiting the day Jesus would come down from the heavens and we would be blissfully reunited with Him.\n\nBut that day didn't come.\n\nWhat came first were the excuses. Justifications due to calculation errors. Then the promises. Promises of it actually being the next day, and then the next day, and the next one. People started not believing the words of those that had led them there. They started opening their eyes and realizing that they were not 'saints', that they were not going to be 'saved'. Jesus was not coming down from heaven, at least not yet.\n\nWhat started as disbelief quickly turned into hate towards the ones that had misguided them. The masses stormed the government buildings, dragging out the leaders that not long ago they had followed. They were dragged out of their offices and into public squares, and then condemned, criticized and accused. Finally, in most cases they were executed, imprisoned the rest. None could escape the ire of the vengeful masses."
 flavor_gbr.120.a: "The wheel has unavoidably turned."
 flavor_gbr.121.t: "Anglicanism in the Holy Roman Empire"
 flavor_gbr.121.desc: "The Holy Roman Empire has seen its fair share of religious division. For many years have Catholicism and Protestantism been struggling for control of it. It is time we put an end to it. No longer shall the Empire be swayed by those heretic beliefs. Only Anglicanism is to be the official religion of the Holy Roman Empire, as it is ordained by God Himself. With Anglicanism as the only official religion of the Empire, our supremacy over it is assured."
 flavor_gbr.121.a: "United into one faith."
 flavor_gbr.122.t: "[Root.GetUsableNameCap] in the Age of Reformation"
 flavor_gbr.122.desc: "The Reformation has erupted in Europe and plunges continental Europe into religious chaos and anarchy. The authority of the Pope is at its lowest and many different theologians compete in their theorems regarding the mysticism of the faith.\nNaturally, the Reformation has reached [Root.GetUsableName] too, and the [Root.GetAdjective] fight against each other for religious superiority while stance of [Root.GetUsableName] is in complete dependency to the beloved [Root.Monarch.GetTitle]."
 flavor_gbr.122.a: "Uncertain times are ahead..."
 flavor_gbr.122.a.tt: "The Religion of every new §Y[Root.Monarch.GetTitle]§! and §YHeir§! has now a §Y50.0%§! chance to be of a §YHeretic§! religion as long this modifier is active.\nRulers can assume a §YReligious Position§! towards the Reformation which will affect future events."
 flavor_gbr.199.t: "Pax Britannica"
 flavor_gbr.199.t.a: "Pax Radogostida"
 flavor_gbr.199.t.b: "[Root.GetPaxBritannica]"
 flavor_gbr.199.desc.a: "Our country has reached a size, prosperity and stability never seen before. Our glorious rule has brought unprecedented wealth to the population, and all over the world people respect our authority. The saying that 'the sun never sets on the British Empire' is not an allegory but an actual undeniable fact.\n\nIn this time of peace and prosperity, people have started to compare our [Root.Monarch.GetTitle] [Root.Monarch.GetName] to the likes of the greatest rulers of the past, and specially Caesar Augustus. His establishment of the Roman Empire and the peace and prosperity it brought are being paralleled to the rule of [Root.Monarch.GetName] and the prosperity [Root.Monarch.GetSheHe] [Root.Monarch.GetHerselfHimself] has brought us.\n\nWe enjoy a true Pax Britannica."
 flavor_gbr.199.desc.b: "Our country has reached a size, prosperity and stability never seen before. Our glorious rule has brought unprecedented wealth to the population, and all over Europe people respect our authority. The joining of England and Serbia has proved more successful even than what we had expected.\n\nIn this time of peace and prosperity, people have started to compare our [Root.Monarch.GetTitle] [Root.Monarch.GetName] to the likes of the greatest rulers of the past, and specially Caesar Augustus. His establishment of the Roman Empire and the peace and prosperity it brought are being paralleled to the rule of [Root.Monarch.GetName] and the prosperity [Root.Monarch.GetSheHe] [Root.Monarch.GetHerselfHimself] has brought us.\n\nWe enjoy a true Pax Radogostid."
 flavor_gbr.199.a: "We are the most glorious empire."
 flavor_gbr.200.t: "Colonial Venture"
 flavor_gbr.200.desc: "Our recent colonial investments are clearly producing fruit. A message has just come from our recent colony in [Root.GetName], informing us of their success in establishing the village. Colonists are already expanding their lodgings and infrastructure there, and the local authorities are doubtful about which direction should they lead the colony into. As such, they ask for the guidance of [Root.Owner.Monarch.GetTitle] [Root.Owner.Monarch.GetName], to develop it into what most benefits the nation."
 flavor_gbr.200.a: "[Root.GetTradeGoodsName] is sufficient enough."
