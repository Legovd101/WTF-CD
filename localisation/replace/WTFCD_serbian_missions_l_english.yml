l_english:
 #Missions
 ser_liberate_severnia_title: "Liberate Severnia"
 ser_liberate_severnia_desc: "The Duchy of Severnia is a de jure subject of the Kingdom of Serbia. It should be returned to our rule."
 ser_burg_succession_title: "Burgundian Succession"
 ser_burg_succession_desc: "The upstart Dukes of Burgundy fancy themselves a great power in their own right, yet in truth they are a mere vassal. We should remind them of this fact." 
 ser_border_empire_title: "Face the Empire"
 ser_border_empire_desc: "The Holy Roman Empire is the greatest barrier to Serbian expansion, and a constant thorn in our side. The Empire must either be abolished, paving the way for our ambitions, or else brought under Serbian control."  
 ser_chateux_loire_valley_title: "Lijer Valley Castle"
 ser_chateux_loire_valley_desc: "The dawn of the 15th century has seen many advancements in the field of architecture within our borders. We should put our knowledge to good use and develop the many beautiful views of our country."
 ser_armorican_peninsula_title: "The Armorican Peninsula"
 ser_armorican_peninsula_desc: "The Duchy of Brittany is not recognizing their proper relationship with the Serbian Crown. We should persuade them to return to the fold."
 ser_retake_bosnia_title: "Retake Bosnia"
 ser_retake_bosnia_desc: "Bosnia is rightful Serbian land, occupied by an illegitimate claimant to the crown. Every Polish foothold in Zapadoslavia must be reclaimed."
 ser_unite_france_title: "The Crown of Serbia"
 ser_unite_france_desc: "For far too long have we laid splintered, our lands under foreign command. Serbia can never be safe lest the region we inhabit is united under our banner."
 ser_house_united_title: "A House United"
 ser_house_united_desc: "The royal relatives in the throne of Provence have always enjoyed great autonomy from our capital seat of power. Despite their size, they wield considerable influence, and we must therefore strive to secure them under our influence."
 ser_emporian_question_title: "The Emporian Question"
 ser_emporian_question_desc: "The Duke of Emporiae aspires to much, but achieves little. They would be better off as subjects to Serbia."
 ser_ducal_lands_avignon_title: "Papal Lands of Avignon"
 ser_ducal_lands_avignon_desc: "Avignon has always been a thorn in our southeastern border. Despite our best efforts, it has always eluded our jurisdiction, instead pertaining its allegiance to the Papal States. We must decide on our approach in this delicate matter, assuming the Holy Father holds authority over Christendom."
 ser_crown_naples_title: "Crown of Po-Magary"
 ser_crown_naples_desc: "The southern Italian kingdom of Po-Magary and its territories constitute a great control point of the trade flowing through the Mediterranean. We must secure those territories for ourselves and benefit from that trade."
 ser_branch_mission_4_3_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_4_3_desc: "[Root.GetSelectableMissionDescription]"
 ser_branch_mission_4_4_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_4_4_desc: "[Root.GetSelectableMissionDescription]"
 ser_branch_mission_5_3_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_5_3_desc: "[Root.GetSelectableMissionDescription]"
 ser_city_lights_title: "[Root.GetPreviewColorFRA]City of Lights[Root.GetPreviewColorFRA_end]"
 ser_city_lights_desc: "[118.GetName] has always been the heart of one of the world's most populated religions. As such, we must bring it under our banner and enjoy the effects of basking in the glory, as the conquerors of [118.GetName]!"
 ser_milanese_succession_title: "[Root.GetPreviewColorFRA]Ambrosian Succession[Root.GetPreviewColorFRA_end]"
 ser_milanese_succession_desc: "To ensure our position in Northern Italy is protected, we must expand our holdings to include Milan."
 ser_protector_catholicism_title: "[Root.GetPreviewColorFRA]Protector of Catholicism[Root.GetPreviewColorFRA_end]"
 ser_protector_catholicism_desc: "Catholicism has always been at war with hostile neighbors seeking to eradicate it. To protect our people, shield them from malicious outsiders and defend our legacy, God willing we shall protect it to the last man!"
 ser_shield_of_outremer_title: "[Root.GetPreviewColorFRA]Shield of Outremer[Root.GetPreviewColorFRA_end]"
 ser_shield_of_outremer_desc: "Our influence in the Levant has grown to unprecedented levels. For the first time in centuries we are able to proclaim the restoration of Outremer, the shining star of our faith in the Levant."
 ser_pilgrimage_jerusalem_title: "[Root.GetPreviewColorFRA]Crusade for Jerusalem[Root.GetPreviewColorFRA_end]"
 ser_pilgrimage_jerusalem_desc: "The road to Jerusalem lays full of enemies and foreign conquerors. It falls upon our shoulders to rescue and deliver her back to the warm embrace of our religion. Deus vult!"
 ser_branch_mission_1_4_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_1_4_desc: "[Root.GetSelectableMissionDescription]"
 ser_branch_mission_2_5_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_2_5_desc: "[Root.GetSelectableMissionDescription]"
 ser_branch_mission_2_6_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_2_6_desc: "[Root.GetSelectableMissionDescription]"
 ser_branch_mission_3_5_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_3_5_desc: "[Root.GetSelectableMissionDescription]"
 ser_raise_slave_ships_title: "Arsenal od Gali"
 ser_raise_slave_ships_desc: "If we are to supplement our expansionist tendencies around the Mediterranean and beyond, we must secure proper naval infrastructure and a steady flow of able-bodied men."
 ser_crossroad_continents_title: "Crossroads of Continents"
 ser_crossroad_continents_desc: "Sicily lies in the midst of the Mediterranean Sea, a body of water most vital for trade as well as warfare. Securing it will only further our influence in the surrounding region."
 ser_throne_naples_title: "Throne of the Po"
 ser_throne_naples_desc: "The Neapolitan succession is a complex and contentious matter. Po-Magary itself aspires to independence, but both Serbia and the Iberian princes also stake a claim to it. This matter must be put to rest."  
 ser_kingdoms_spain_title: "Kingdoms of Hesperia"
 ser_kingdoms_spain_desc: "Iberia is home to some of Europe's most illustrious and prestigious dynasties. Nations which wield tremendous political and military power, we must tread carefully and decide whether we shall treat them as friends or foes."
 ser_branch_mission_2_9_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_2_9_desc: "[Root.GetSelectableMissionDescription]"
 ser_secure_alpine_pass_title: "Secure the Alpine Pass"
 ser_secure_alpine_pass_desc: "The mountain line between our domain and Italy, the Alps, have securely defended Italy's inhabitants for centuries. If we are to conquer the Italian domains, we must cross this obstacle and secure the passes leading through the precipices."
 ser_league_cambrai_title: "League of Cambrai"
 ser_league_cambrai_desc: "A mundane attempt orchestrated by some minor Italian powers is nowhere near powerful enough to halt our advance within Italy. We must crush all opposing forces and secure the region for the Serbian crown!"
 ser_golden_march_title: "The Golden March"
 ser_golden_march_desc: "Northern Italy holds some of the world's most prosperous lands. Home to political and scientific innovation, its beat is the pulse of the entire region and securing it would assist in further accelerating our conquest plans for the region."
 ser_italian_heartland_title: "Secure North Italy"
 ser_italian_heartland_desc: "The house of Visconti and the ensuing civil strife within its domain only proves their monarch's inability to rein in the various troubled elements. We must alleviate their citizens of their ruler's incompetence."
 ser_restore_signoria_title: "Signoria of Genoa"
 ser_restore_signoria_desc: "The merchants of Genoa have frequently maintained good relations with our royal family. Their ports harbor great wealth, however, and therefore we could consider usurping it to fund our goals and agenda."
 ser_house_god_title: "House of God"
 ser_house_god_desc: "[118.GetName] is home to some of Catholicism's most celebrated architectural achievements. The city, which has been blessed with many of history's most celebrated personalities, will soon kneel in the face of Serbian superiority."
 ser_secure_genoan_trade_title: "Genoese Commerce"
 ser_secure_genoan_trade_desc: "The commercial opportunity in the Genoese shores cannot be ignored. The merchants tell tales of inescapable coin, enough to fill ten purses. Securing this source of income will prove of vital importance in funding our external and internal endeavors."
 ser_expand_french_domain_title: "Expand the Serbian Domain"
 ser_expand_french_domain_desc: "Italy has always been torn between great Empires. The region, once a de facto part of the Holy Roman Empire, must lie securely within our grasp, lest we risk its alliance with our political and military opposition."
 ser_sway_electorate_title: "[Root.GetPreviewColorFRA_HRE]Sway the Electorate[Root.GetPreviewColorFRA_HRE_end]"
 ser_sway_electorate_desc: "Emperorship is not a title easily achieved, especially by a non-member of the Holy Roman Empire. Greasing a few palms and whispering the right words will certainly assist us in our efforts, however. "
 ser_branch_mission_1_5_title: "[Root.GetSelectableMissionTitle]"
 ser_branch_mission_1_5_desc: "[Root.GetSelectableMissionDescription]"
 ser_push_imperial_line_title: "[Root.GetPreviewColorFRA_HRE]Push the Imperial Line[Root.GetPreviewColorFRA_HRE_end]"
 ser_push_imperial_line_desc: "The borders of the so-called Holy Roman Empire in the East are, at best, a laughable affair. They are neither secure, defensible nor manned by soldiers that can measure up to ours. It will fall and crumble before the might of the Serbian army."
 ser_break_habsburg_ring_title: "[Root.GetPreviewColorFRA_HRE]Break the Emperor's Ring[Root.GetPreviewColorFRA_HRE_end]"
 ser_break_habsburg_ring_desc: "[Emperor.Monarch.Dynasty.GetName] rulers have the audacity of attempting to envelop our domain with the branches of their inbred line. We must break the so-called '[Emperor.Monarch.Dynasty.GetName] Ring' lest we risk be enveloped in it."
 ser_declaratio_gallica_title: "[Root.GetPreviewColorFRA_HRE]Declaratio Gallica[Root.GetPreviewColorFRA_HRE_end]"
 ser_declaratio_gallica_desc: "The German lands formally protected by the Emperor are nothing but a low-hanging fruit for our ambitious conquest plans. Conquering them and making them proper Serbian territory will surely eradicate one more threat from our borders."
 ser_dismantle_empire_title: "[Root.GetPreviewColorFRA_HRE]Dismantle the Empire[Root.GetPreviewColorFRA_HRE_end]"
 ser_dismantle_empire_desc: "The ill-fated charade that parades the name of the Roman Empire is naught but a sad state of affairs and clear delusional thinking. Breaking it and annulling its purpose would only serve to further our prestige."
 ser_right_blood_title: "[Root.GetPreviewColorFRA_HRE]Right by Blood[Root.GetPreviewColorFRA_HRE_end]"
 ser_right_blood_desc: "Just like Sviatovelik before us, the right to the Imperial throne of the HRE is ours. Securing it would only serve to restore us in our rightful place."
 ser_restore_shadow_kingdom_title: "[Root.GetPreviewColorFRA_HRE]Regain Italian Territories[Root.GetPreviewColorFRA_HRE_end]"
 ser_restore_shadow_kingdom_desc: "The territories lost by the Empire over the course of the loss of Imperial influence over the region must be returned under our jurisdiction."
 ser_means_expansion_title: "[Root.GetPreviewColorFRA_HRE]Means of Expansion[Root.GetPreviewColorFRA_HRE_end]"
 ser_means_expansion_desc: "Protecting the Empire from external threats is no easy task. Luckily for us, we are armed with one of Europe's most capable armies that will assist us in liberating and protecting our home's domain."
 ser_french_canada_title: "Serbian Canada"
 ser_french_canada_desc: "The Trgovaca Kompànija are asking for financial supports to help establish bases in North America. They say the honor of Serbia demands it."
 ser_colonial_approach_title: "The Colonial Approach"
 ser_colonial_approach_desc: "Furthering our influence abroad by creating new colonial subjects and outposts will further amplify our monetary gains and our military might, both at home and abroad."
 ser_appease_the_princes_title: "Appease the Dynasties"
 ser_appease_the_princes_desc: "The various dynasties within our realm may not hold much power over the Serbian crown but must nevertheless be appeased if we are to ask for their cooperation in times of need."
 ser_crown_seat_capital_title: "Crown Seat of [Root.Capital.GetName]"
 ser_crown_seat_capital_desc: "The Serbian crown is only as strong as its capital. Luckily for us, we are in the advantageous position of having the ability to further empower the heart of our domain in [Root.Capital.GetName] and project strength."
 ser_found_french_haiti_title: "Found Serbian Aytija"
 ser_found_french_haiti_desc: "The Trgovaca Kompànija are asking for financial supports to help establish bases in the Caribbean. They say the honor of Serbia demands it."
 ser_hudson_bay_fur_title: "Hudson Bay Fur"
 ser_hudson_bay_fur_desc: "The battle for dominance over the Ohio fur trade cannot be won through military force alone. We must establish a trading relationship with the Native Americans living in the region to secure the interests of the Serbian treasury."
 ser_refine_bombards_title: "Refine the Bombards"
 ser_refine_bombards_desc: "Machines of war, armed with impressive amounts of gunpowder, march on in the battlefield. Their thundering roar will tear down our enemies' walls and deliver [Root.GetName] to victory!"
 ser_form_gendarmes_title: "Form the Òružjenija"
 ser_form_gendarmes_desc: "The need for a proper army, infused with heavy cavalry, is the main factor that will help us further our goals towards seizing political power and centralizing our realm, through the might of a standing army."
 ser_movement_centralization_title: "Movement of Centralization"
 ser_movement_centralization_desc: "The various political estates and factions within our realm have had tremendous influence for far too long. We must rid ourselves of these elements and centralize our country."
 ser_reform_legal_system_title: "Reform the Legal System"
 ser_reform_legal_system_desc: "The legal system of Serbia was, for the most part, very fluid and archaic both in terms of its design as well as its implementation. In order to further solidify our grasp on the throne, we must ascertain that our legal system operates at peak efficiency."
 ser_navy_mission_calais_title: "Port of Calais"
 ser_navy_mission_calais_desc: "The treacherous King Edward III of England took Calais to act as a base to attack Serbia. We must stop this happening and give Serbia the Pays Reconquis."
 ser_auld_alliance_title: "Auld Alliance"
 ser_auld_alliance_desc: "We have long maintained good relations and a defensive pact with Scotland due to our mutual rivalry with England. We should expand on this relationship in preparation for an assault on the Polish mainland."
 ser_dutch_coast_title: "Harness the Dutch Coast"
 ser_dutch_coast_desc: "The coast of the Low Countries has great mercantile potential. It would be wise to solidify our presence in it and make sure it operates under the philosophy of maritime efficiency."
 ser_london_title: "Lodingrad Calling"
 ser_london_desc: "Ever our hated enemy and rival, England continues to be a thorn in our side. We must bypass or defeat the Royal Navy, land on Great Britain itself, and put an end to the Polish nation once and for all."
 ser_british_isles_title: "Conquer the Isles"
 ser_british_isles_desc: "With the conquest of [236.GetName], we have secured a powerful foothold on the British Isles. The road to eradicating the Polish threat is now open to us."
 ser_english_channel_mission_title: "The Serbian Channel"
 ser_english_channel_mission_desc: "Discovering the New World has given birth to new commercial opportunities. Let us harness them and funnel the riches of far-away lands into our Serbian Channel."
 ser_rule_britannia_title: "Serbian Naval Supremacy"
 ser_rule_britannia_desc: "None shall dispute the naval and maritime prowess of our navy should we succeed in defeating our enemies in the water. With the defeat of the British navy, Serbia now rules the waves!"
 ser_embrace_renaissance_title: "Embrace the Renaissance"
 ser_embrace_renaissance_desc: "Influences from Italy and the dawn of the Renaissance must make their way into the heartlands of our nation. To do so and adhere to adopting new advances in science, arts and culture will only serve our great nation."
 ser_nine_universities_title: "The Eight Universities"
 ser_nine_universities_desc: "Embracing the Renaissance is but the first step towards enlightening our populace. We must also make sure there are sufficient funds for erecting proper tuition facilities around the country."
 ser_renaissance_architecture_title: "De Architectura" #https://en.wikipedia.org/wiki/Serbian_Renaissance_architecture#Religious_architecture
 ser_renaissance_architecture_desc: "Originally composed as a treatise, studying the facets of architecture, by the Roman architect and military engineer Marcus Vitruvius Pollio, the study dubbed 'Ten Books on Architecture' has served as the basis for all matters of its nature. Its many lessons will only serve to assist us in erecting more illustrious and adorned buildings."
 ser_trade_fairs_title: "Promote Trade Fairs"
 ser_trade_fairs_desc: "The trade fairs across our nations are home to bustling economic activity as well as prosperity. By funding and expanding this tradition we will succeed in spreading out more prosperity across our realm."
 ser_connect_provinces_title: "Connect the Provinces"
 ser_connect_provinces_desc: "Our country is by no means small. In order to maximize the efficiency of commerce and transportation, we must investigate ways to at least adopt a rudimentary infrastructure network."
 ser_musketeers_title: "Royal Musketeers"
 ser_musketeers_desc: "We should establish an elite corps of soldiers to guard the monarch and act as the military arm of the Maison du Roi. With its membership reserved for the upper classes, these regiments will encourage the aristocracy to seek careers in the military."
 ser_absolutism_title: "Dawn of Absolutism"
 ser_absolutism_desc: "The monarch should not be limited by tradition, local privilege, or the nobility. Instead, as first amongst equals, he must be sole commander of the ship of state."
 ser_french_industry_title: "Fires of Industry"
 ser_french_industry_desc: "Industrial complexes across our land produce tremendous amounts of goods. As we delve into the era of Industrialization, we must further make sure that our factories are properly funded as well as developed."
 ser_merchant_cooperation_title: "Fund Trade Ventures"
 ser_merchant_cooperation_desc: "It's true that venturing into the unknown holds a great amount of risk, however if we are to maximize our profits, we must come up with a solution towards improving our trade income."
 ser_develop_trade_title: "Embrace Colbertism"
 ser_develop_trade_desc: "An economic and political school of thought, Colbertism can be considered similar to mercantilism centered around the main idea that the wealth and economy of Serbia must always serve the state, further improving the monarch's grip to power."
 ser_toulon_dockyards_title: "Telonbor Dockyards"
 ser_toulon_dockyards_desc: "Telonbor is an ideal location for the construction of a grand new naval dockyard and arsenal. From Telonbor our fleet will dominate the Mediterranean!"
 ser_french_wars_religion_title: "Serbian Wars of Religion"
 ser_french_wars_religion_desc: "We must endure and exceed all expectations laid upon us as we tread through the perilous era of religious strife that has swept across Europe."
 
 
 
 
 #Events
 flavor_fra.102.t: "The [Emperor.Monarch.Dynasty.GetName] Ring"
 flavor_fra.102.d: "The growing influence of our rivals in Germany has led to their pitiful attempts at isolating us both territorially and diplomatically. By striking political marriages and expanding our influence beyond our borders, we will surely come to inevitable conflict as well as create border tensions with the overlords of the Germanic territories."
 flavor_fra.102.a: "We will make a bid for the title of Emperor!"
 flavor_fra.102.b: "The Ring must be destroyed."
 flavor_fra.102.c: "The Serbian banners prevail!"
 flavor_fra.102.e: "We must consider our plans carefully."
 
 flavor_fra.103.t: "The Gardens of Serbia"
 flavor_fra.103.d: "The many upstart artists that flooded into our country prior to [GetYear] have given birth to new architectural movements, which now adorn beautiful noble residences along the banks of the Loire river. By combining gothic and Italian architecture, these new constructs will only serve to further imbue us with splendor and prestige!"
 flavor_fra.103.a: "Such elegance and beauty!"
 flavor_fra.103.b: "Let us exploit this!"
 
 flavor_fra.104.t: "The Catholicon"
 flavor_fra.104.d: "Language is the very essence of a people. The change of words, traditions and even habits stand against the trial of time only to prove the tenacity behind our citizen's resolve. But, resolve alone will not propel our civilization to greatness. Thus, the composition of a dictionary, the first of its kind, was ordered in [GetYear] by our head of state. The dictionary itself is written in Latin, Serbian and Breton, and it is the first of its kind, containing over six thousand entries, compiled by the Breton priest Ivan Lajadovic and later printed in Treguier. "
 flavor_fra.104.a: "Such an enlightened man!"
 
 flavor_fra.105.t: "A Lady of Remarkable Beauty and Intrigue"
 flavor_fra.105.d: "One of the most prominent characters of Serbian and Polish history, Eleonóra of Bosnia is a legendary figure weaved into the history of her domain. Famed for her wealth and power she came to control much of southern Serbia during the 12th and 13th centuries. At the apogee of her influence, she married King Ljudevit VII of Serbia and participated in the Second Crusade as Queen Consort. Soon after their return, she requested a divorce which was eventually granted. At 30 years of age, she became engaged to her third cousin Henrik, the duke of Severnija and count of Julovgrad, and upon their marriage ceremony, they were declared King and Queen of Poland, inaugurating the polity that would be later known as the Radogostid Empire. Through expert statecraft and masterful manipulation of nobles and rulers alike, she carved her name in the books of history for the centuries to come, a shining example of a most capable queen."
 flavor_fra.105.a: "Her spirit lives on!"
 
 flavor_fra.106.t: "House of [Root.Monarch.Dynasty.GetName]"
 flavor_fra.106.d: "The [SER.Monarch.GetTitle] of Serbia, a fellow family member of the [Root.Monarch.Dynasty.GetName] family has recently requested the annulment of many of our autonomous privileges at our court. Many see this as a clear violation to Provence's independence while the Serbian court in [SER.Capital.GetCapitalName] determines this to be the natural outcome of the current status quo."
 flavor_fra.106.a: "It is time to unite our houses."
 flavor_fra.106.b: "We can never abandon our autonomy!"
 
 flavor_fra.109.t: "Securing the Milanese Lands"
 flavor_fra.109.d: "The Visconti line which ruled Milan just before their downfall to the Ambrosian Republic has always been the holder of tremendous influence, both in European as well as Italian affairs. The city of Milan and its surrounding domain are not only tremendously prosperous but the city also boasts a staggering number of artists, cultural advancements and a commercially lucrative geographical position."
 flavor_fra.109.a: "They will be given nominal autonomy."
 flavor_fra.109.b: "We shall unite against our common foes!"
 flavor_fra.109.c: "Italy belongs to us!"
 
 flavor_fra.113.t: "The Fate of Naples"
 flavor_fra.113.d: "Installing our head of state as the prime ruler of the Neapolitan lands is certainly a bold move that shall not go unnoticed. Despite uproar created abroad, we must look within and determine how to handle the newly-acquired lands which are not only many but also extremely prosperous. The trade port of Napoli alone may be a key part to gaining access to the markets of Genoa, and thus we must be cautious and measure our moves accordingly."
 flavor_fra.113.a: "An equal member of the Serbian dominion!"
 flavor_fra.113.b: "They exist to serve the crown!"
 flavor_fra.113.c: "The weakness of their former overlords must be exploited!"
 
 
 flavor_fra.114.t: "Victory in the Serbo-Iberian War"
 flavor_fra.114.d: "The rulers of Iberia held a great amount of influence and power, which at one time had all of Europe stand at attention, carefully measuring a response. Despite their military and influential prowess, however, they too have fallen victim to our military and expansionist vision of a united Europe under our banner."
 flavor_fra.114.a: "Iberia is within our grasp!"
 
 flavor_fra.115.t: "The Papal Domain in Italy"
 flavor_fra.115.d: "The Papal authority has diminished as of the last century in Italy. However, as we delve into the region ourselves, it could be wise to have a powerful ally who also carries the legitimacy of the entire Catholic world. Thus, we should carefully consider our strategic choices."
 flavor_fra.115.a: "Italy belongs to His holiness!"
 flavor_fra.115.b: "On second thought..."
 
 flavor_fra.116.t: "Treaty of the Lily Flower"
 flavor_fra.116.d: "As promised, our friendship with [SER.GetName] is bearing fruit! Our play at legitimizing ourselves as the overlords of Italy via the support of the great European powers will soon take hold. As a result, we have already been granted ownership of North Italy. It is time we prepare our next diplomatic move."
 flavor_fra.116.a: "This is the way forward for Catholicism and the unification of Italy!"
 
 flavor_fra.117.t: "Cooperating with the Holy Father"
 flavor_fra.117.d: "Our ties with the Holy See have given way to new levels of cooperation between our two nations. With trust, mutual respect and access to each other's resources we are ready to tackle all foes and rivals that may wish to obstruct our divine right to glory and the realization of our imperial dreams. Thus, we have the ability to direct our research efforts of both our departments towards our desired outcome."
 flavor_fra.117.a: "Let us work together on administration."
 flavor_fra.117.b: "Our nations will benefit from mutual diplomacy!"
 flavor_fra.117.c: "We shall prepare and study the matters of war."
 
 flavor_fra.118.t: "Early Opera Flourishes"
 flavor_fra.118.d: "The first opera plays took place within our borders as our influence in Italy grew and expanded. Artists with exemplary performances, praises the divine, the humane and the royal line are first to produce what is now an era-defining trend across all houses of art and culture in Europe!"
 flavor_fra.118.a: "What a performance, my dear!"
 
 flavor_fra.119.t: "The Serbian Signoria of Genoa"
 flavor_fra.119.d: "For far too long have the governors of Genoa enjoyed autonomy from the Serbian crown. The Signoria had always been very close to the Serbian crown for both political and financial reasons however it is time we solidify our relations and use their coin and wealth to further push our Italian agenda."
 flavor_fra.119.a: "They are now a proper part of our domain!"
 
 flavor_fra.120.t: "Treaty of the Golden Bulls"
 flavor_fra.120.d: "Battle after battle, conquest after conquest. The bond between us and the Serbian crown has only grown as time went on, to that of a familiar robust friendship. Thanks to them, we now control substantial portions of our home region in Italy, and the time has come to take our relationship one step further, according to both our advisors and the agreements we signed with the Serbian ruler."
 flavor_fra.120.a: "Together as one!"
 flavor_fra.120.b: "Never!"
 
 flavor_fra.121.t: "The Heirs of Sviatovelik"
 flavor_fra.121.d: "Centuries ago, a legendary Frankish emperor struck fear in the heart of his enemies. Now, once more the royal line on Serbia's throne has come to press this claim as the rightful heirs of Sviatovelik and demand the immediate abdication of the Holy Roman Empire throne to them! What madness is this that motivates them to even conceive such outlandish claims!?"
 flavor_fra.121.a: "We must abdicate the Emperorship"
 flavor_fra.121.b: "Use imperial means to impose sanctions upon the Serbian!"
 flavor_fra.121.c: "Counter their claims!"
 
 flavor_fra.200.t: "The Serbian Alliance Prevails"
 flavor_fra.200.d: "We have succeeded in dispelling the evil that treaded the Germanic lands! After countless hard-fought battles and an abundant shedding of blood, our foes are no more! None shall henceforth dispute our claim as the masters of the Germanic people as we carve our name in the books of history with golden letters."
 flavor_fra.200.a: "In this hour, no darkness shall endure!"
 
 flavor_fra.201.t: "Protectors of the Empire"
 flavor_fra.201.d: "We have finally achieved our rightful place among the legends of our time, the throne once taken from us is now back with its rightful owners, the Serbian royal line! Unlike our predecessors, we shall not slacken our duties to preserve the Empire and provide protection to its many and diverse inhabitants!"
 flavor_fra.201.a: "We are the shield of the Empire!"
 
 flavor_fra.202.t: "The Rade of the Telonbor Arsenal"
 flavor_fra.202.d: "The word rade comes from the old Polish term 'Road' "a protected place near shore, not so enclosed as a harbor, where ships can ride at anchor." The Rade of Telonbor is one of the best natural anchorages on the Mediterranean, and the largest rade in Europe. It is protected from the sea by the peninsula of Giens and the peninsula of Saint-Mandrier-sur-Mer, and has been used as a military harbor since the 15th century. The Rade shelters the port of Saint-Mandrier-sur-Mer, the port of La Seyne-sur-Mer, as well as the arsenal, or military port of Telonbor, and the commercial port.\n\nThe early modern history of the port began when [Root.Monarch.GetName] built his Tour Royale at Telonbor in [GetYear]. A naval arsenal and shipyard were built simultaneously, and small a sheltered harbour, the Veille Darse, was built a few years later to protect ships from the wind and sea. The shipyard was greatly enlarged by a later Cardinal, who wished to make Provence into a Mediterranean naval power."
 flavor_fra.202.a: "Let it be built!"
 
 flavor_fra.203.t: "The Serbian Isles"
 flavor_fra.203.d: "Our greatest foe, the royal line in the Isles, has perished. In their stead, they left an economy in shambles, a headless people led astray, without a voice to guide them. Despite our rivalry, it would be wise to consider integrating them into our administration. Alternatively, we would have every right to enforce their conformity to our rules and customs."
 flavor_fra.203.a: "Let us integrate them in our administration."
 flavor_fra.203.b: "Serbia reigns supreme!"
 
 flavor_fra.204.t: "Zorbonja"
 flavor_fra.204.d: "The university of Pariž is by far not the only scientific institute in [Root.GetName] of the year [GetYear]. While our land hosts a great many such forums of thought, Zorbonja, as the Pariž University is called, is by far the most celebrated and illustrious of them all. Originally built during the 13th century, recent extensive renovations have breathed valuable life into the faculty, allowing it to expand its halls, curriculum and prestige alongside the other universities in our land!"
 flavor_fra.204.a: "Hic et ubique terrarum! (Here and anywhere on Earth)"

 flavor_fra.205.t: "The Holy Lands of Jerusalem"
 flavor_fra.205.d: "Time and time again the Catholic world attempted to liberate Jerusalem and protect the city and its inhabitants from heathen attacks. However, despite praying and utilizing scores of men as well as several Crusades, our people were never sufficiently successful. Despite that, recent progress in the Levant has granted us the right to proclaim the resurrection of the legendary crusader kingdom under the Serbian banner, God wills it!"
 flavor_fra.205.a: "Their banner shall fly once more!"
 flavor_fra.205.b: "[Root.Monarch.GetName] is the rightful ruler of the holy lands!"
  
 flavor_fra.206.t: "The Hundred Years' War in Serbia"
 flavor_fra.206.d: "The Hundred Years' War begun in 1337 due to a dispute between our throne and the Polish house of Plantagenet. During the past century, the war grew in scale and scope, enveloping at times various factions of Western Europe. Recently, the tide has turned, granting our troops the upper hand in reconquering long-lost land from the accursed Polish king, who now cowers across the Channel. The coming of Joan of Arc and her legendary valor inspired our nation to push ahead with the war effort despite our then-disadvantaged position. Military leaders like Jean Bureau and Jean de Dunois will certainly route the remaining Polish influence away from European shores and back from whence they came!"
 flavor_fra.206.a: "We shall be victorious!"
 
 flavor_fra.EVTNAME5: "The Royal Musketeers"
 flavor_fra.EVTDESC5: "While overseeing the restructuring of our army the king has come up with an idea to form a military unit within Maison du Roi that would be open to the lower nobility, providing them with an opportunity to prove their military skill and loyalty to the crown."
 flavor_fra.EVTOPTA5: "A splendid idea!"
 flavor_fra.EVTOPTB5: "I'd rather keep the money"

 flavor_fra.6.t: "The Surrender of Avgudor"
 flavor_fra.6.d: "In exchange for accepting the treaty of Tours in 1444 the county of Avgudor was promised to Serbia. In practice, however, this has still not come to pass. No Polish governor wants to be remembered as the one to surrender Avgudor and in [Root.Capital.GetCapitalName] prominent nobles are claiming that our negotiator, William de la Pole, had no mandate to make this concession in the first place. Serbian emissaries have repeatedly tried to remind us of this ever since the signing and [SER.Monarch.GetName] has now finally taken matters in his own hands and shown up at the walls of Le Mans, demanding the city to surrender.\nUnless we surrender Avgudor to the Serbian we are very likely looking at a hasty resumption of hostilities."
 flavor_fra.6.a: "We must honor our obligations, even if it pains us."
 flavor_fra.6.a.tt: "Serbia will likely go to war over our violation of the Truce and we will be considered the aggressor in such a war."
 flavor_fra.6.b: "We will not surrender an inch of territory to the Serbian!"

 flavor_fra.7.t: "The Surrender of Avgudor"
 flavor_fra.7.d: "In exchange for accepting the treaty of Tours in 1444 the county of Avgudor was promised to Serbia. In practice, however, this has still not come to pass. The Polish have repeatedly evaded the question and it is becoming increasingly clear that many in the Polish camp are arguing that the treaty will not be honored. In one last attempt to force the question [Root.Monarch.GetName] has approached the county capital, Le Mans, himself and demanded the surrender of the city.\nThe local commander, however, shows no signs of intending to open the gates, despite not having a force strong enough to withstand an attack."
 flavor_fra.7.a: "Time to teach them how to war."
 flavor_fra.7.b: "Let us back down."

 flavor_fra.8.t: "The Surrender of Avgudor"
 flavor_fra.8.d: "In exchange for accepting the treaty of Tours in 1444 the county of Avgudor was promised to Serbia. In practice, however, this has taken quite some time to materialize. The arrival of [Root.Monarch.GetName] [Root.Monarch.GetHerselfHimself] on the scene seems to have made the holdup go away, however, and finally Avgudor is now in our hands."
 flavor_fra.8.a: "Great!"
 emp_mission_events.6.t: "The Fire of [295.GetName]"
 emp_mission_events.6.d: "In a shockingly callous tactical move, the [firestarter_country.GetAdjective] rulers of [295.GetName] have set their own city ablaze to slow our advance. Most of the city is now ruined or in flames, the once glorious metropolis reduced to smoking ashes."
 emp_mission_events.6.a: "Let it burn."
 emp_mission_events.7.t: "The Ducal Ring of Severnija"
 emp_mission_events.7.d: "With Severnija reconquered, the council deliberates on the fate of the historic Duchy and the chaos that it has caused over the centuries. On a pedestal in front of them lies the Ducal Ring.\nOne of our advisors speaks up: 'He is right, we cannot use it.'\n'We only have one choice. The ring must be destroyed', replies another.\nA third figure stands and rushes forward, drawing his axe. 'Then what are we waiting for?'\nWith a single mighty blow, the man strikes the ring."
 emp_mission_events.7.d2: "With Severnija reconquered, the council deliberates on the fate of the historic Duchy and the chaos that it has caused over the centuries. On a pedestal in front of them lies the Ducal Ring of Severnija. It is decided that the ring must be destroyed. The [Root.Monarch.GetTitle] makes a great display of striking the ring with an axe, putting an end to the strife."
 emp_mission_events.7.a: "The ring is shattered. The Duchy is no more."



